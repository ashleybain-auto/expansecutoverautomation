    lblRegNextMilestone As modernText:
        Align: =Align.Center
        AutoHeight: =true
        BorderStyle: =""
        Color: |-
            =ColorValue("#03173E")
        Font: =Font.Arial
        FontWeight: =FontWeight.Semibold
        Height: =30
        Size: =17
        Text: |-
            =With(
                {
                    nextEvent: First(
                        Sort(
                            Filter(
                                colECCSCutoverSchedule,
                                StartDate >= Today()
                            ),
                            StartDate,
                            SortOrder.Ascending
                        )
                    )
                },
                If(
                    IsBlank(nextEvent.EventName),
                    "No milestone scheduled",
                    nextEvent.EventName &
                    " | " &
                    Text(
                        nextEvent.StartDate,
                        "[$-en-US]mmmm d, yyyy"
                    )
                )
            )
        Width: =300
        X: =827
        Y: =15
        ZIndex: =29

    lblRegCountdownLaunchpad As modernText:
        Align: =Align.Center
        AutoHeight: =true
        BorderStyle: =""
        Color: |-
            =ColorValue("#E05929")
        Font: =Font.Arial
        FontWeight: =FontWeight.Bold
        Height: =40
        Size: =20
        Text: |-
            =With(
                {
                    nextEvent: First(
                        Sort(
                            Filter(
                                colECCSCutoverSchedule,
                                StartDate >= Now()
                            ),
                            StartDate,
                            SortOrder.Ascending
                        )
                    )
                },
                If(
                    IsBlank(nextEvent.EventName),
                    "COUNTDOWN NOT CONFIGURED",
                    With(
                        {
                            totalMinutes: DateDiff(
                                Now(),
                                nextEvent.StartDate,
                                TimeUnit.Minutes
                            )
                        },
                        If(
                            totalMinutes <= 0,
                            "EVENT ACTIVE",
                            Int(totalMinutes / 1440) &
                            "d " &
                            Mod(
                                Int(totalMinutes / 60),
                                24
                            ) &
                            "h " &
                            Mod(
                                totalMinutes,
                                60
                            ) &
                            "m"
                        )
                    )
                )
            )
        Width: =200
        X: =877
        Y: =47
        ZIndex: =30


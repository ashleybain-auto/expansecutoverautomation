    lblRegReadinessMappedValue As modernText:
        AutoHeight: =true
        BorderStyle: =""
        Color: |-
            =ColorValue("#03173E")
        Font: =Font.Arial
        FontWeight: =FontWeight.Bold
        Height: =36
        Size: =20
        Text: |-
            =Text(
                Round(
                    100 *
                    (
                        Sum(
                            colRegReadiness,
                            TestRecords
                        ) +
                        Sum(
                            colRegReadiness,
                            ZconRecords
                        ) +
                        Sum(
                            colRegReadiness,
                            LiveRecords
                        )
                    ) /
                    Max(
                        1,
                        Sum(
                            colRegReadiness,
                            TotalRecords
                        )
                    ),
                    0

    lblRegWorksheetReadiness As modernText:
        Align: =Align.Right
        BorderStyle: =""
        Color: |-
            =ColorValue("#54585A")
        Font: =Font.Arial
        Height: =248
        Size: =16
        Text: |-
            =Concat(
                Sort(
                    colRegReadiness,
                    WorksheetName,
                    SortOrder.Ascending
                ),
                WorksheetName &
                "    " &
                Text(TotalRecords) &
                " records    " &
                Text(
                    Round(
                        100 *
                        (
                            TestRecords +
                            ZconRecords +
                            LiveRecords
                        ) /
                        Max(
                            1,
                            TotalRecords
                        ),
                        0
                    )
                ) &
                "% mapped    " &
                Text(
                    Round(
                        100 *
                        LiveRecords /
                        Max(
                            1,
                            TotalRecords
                        ),
                        0
                    )
                ) &
                "% LIVE    " &
                Text(NoMatchRecords) &
                " NO MATCH" &
                Char(10)
            )
        VerticalAlign: =VerticalAlign.Top
        Width: =604
        X: =744
        Y: =207
        ZIndex: =32


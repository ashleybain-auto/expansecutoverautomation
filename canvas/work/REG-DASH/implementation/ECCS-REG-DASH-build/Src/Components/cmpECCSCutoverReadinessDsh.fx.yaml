    lblRegEventDate As modernText:
        Align: =Align.Right
        AutoHeight: =true
        BorderStyle: =""
        Color: |-
            =ColorValue("#03173E")
        Font: =Font.Arial
        FontWeight: =FontWeight.Semibold
        Text: |-
            =With(
                {
                    nextEvent: First(
                        Sort(
                            Filter(
                                colECCSCutoverSchedule,
                                StartDate >= Today()
                            ),
                            StartDate,
                            SortOrder.Ascending
                        )
                    )
                },
                If(
                    IsBlank(nextEvent.StartDate),
                    "No milestone scheduled",
                    nextEvent.EventName &
                    " | " &
                    Text(
                        nextEvent.StartDate,
                        "[$-en-US]mmmm d, yyyy"
                    )
                )
            )
        Width: =310
        X: =890
        Y: =82
        ZIndex: =8

    lblRegCountdown As modernText:
        Align: =Align.Center
        BorderStyle: =""
        Color: |-
            =ColorValue("#E05929")
        Font: =Font.Arial
        FontWeight: =FontWeight.Bold
        Height: =45
        Size: =22
        Text: |-
            =With(
                {
                    nextEvent: First(
                        Sort(
                            Filter(
                                colECCSCutoverSchedule,
                                StartDate >= Now()
                            ),
                            StartDate,
                            SortOrder.Ascending
                        )
                    )
                },
                If(
                    IsBlank(nextEvent.StartDate),
                    "COUNTDOWN NOT CONFIGURED",
                    With(
                        {
                            totalMinutes: DateDiff(
                                Now(),
                                nextEvent.StartDate,
                                TimeUnit.Minutes
                            )
                        },
                        If(
                            totalMinutes <= 0,
                            "EVENT ACTIVE",
                            Int(totalMinutes / 1440) &
                            "d " &
                            Mod(
                                Int(totalMinutes / 60),
                                24
                            ) &
                            "h " &
                            Mod(
                                totalMinutes,
                                60
                            ) &
                            "m"
                        )
                    )
                )
            )
        Width: =210
        X: =990
        Y: =112
        ZIndex: =9


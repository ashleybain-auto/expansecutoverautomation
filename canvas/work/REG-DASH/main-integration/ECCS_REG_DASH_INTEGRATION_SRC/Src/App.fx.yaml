App As appinfo:
    BackEnabled: =true
    OnStart: |-
        =Set(
            gblDashboardExpanded,
            false
        );
        Set(
            gblSelectedMatchCategory,
            ""
        );
        Set(
            gblSelectedWorksheet,
            ""
        );
        ClearCollect(
            colMatchDashboard,
            {
                MatchCategory: "NO MATCH",
                DisplayLabel: "No Match"
            },
            {
                MatchCategory: "TEST",
                DisplayLabel: "TEST"
            },
            {
                MatchCategory: "ZCON",
                DisplayLabel: "ZCON"
            },
            {
                MatchCategory: "LIVE",
                DisplayLabel: "LIVE"
            }
        );
        // REG-DASH isolation test: original readiness calculation backed up.
        ClearCollect(
            colRegReadiness,
            {
                WorksheetName: "Diagnostic",
                TotalRecords: 0,
                NoMatchRecords: 0,
                TestRecords: 0,
                ZconRecords: 0,
                LiveRecords: 0
            }
        );
        ClearCollect(
            colECCSCutoverSchedule,
            {
                EventName: "3A UAT - EFL",
                Phase: "UAT",
                StartDate: DateTimeValue("2026-09-03T00:00:00"),
                FinishDate: DateTimeValue("2026-09-11T00:00:00")
            },
            {
                EventName: "3A Go Live - EFL",
                Phase: "Go Live",
                StartDate: DateTimeValue("2026-10-15T00:00:00"),
                FinishDate: DateTimeValue("2026-10-15T00:00:00")
            },
            {
                EventName: "3B UAT - NTX",
                Phase: "UAT",
                StartDate: DateTimeValue("2026-12-07T00:00:00"),
                FinishDate: DateTimeValue("2026-12-11T00:00:00")
            },
            {
                EventName: "3B Go Live - NTX",
                Phase: "Go Live",
                StartDate: DateTimeValue("2027-01-14T00:00:00"),
                FinishDate: DateTimeValue("2027-01-14T00:00:00")
            }
        )
    Theme: =PowerAppsTheme

    Host As hostControl.DefaultHostControlVariant:
        OnCancel: =false
        OnEdit: =false
        OnNew: =false
        OnSave: =false
        OnView: =false


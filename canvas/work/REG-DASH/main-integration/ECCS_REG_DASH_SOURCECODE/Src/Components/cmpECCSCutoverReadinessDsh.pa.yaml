ComponentDefinitions:
  cmpECCSCutoverReadinessDsh:
    DefinitionType: CanvasComponent
    Description: ReadinessDashboard
    AccessAppScope: true
    CustomProperties:
      BoardSubtitle:
        PropertyKind: Input
        DisplayName: Board Subtitle
        Description: A custom property
        DataType: Text
        Default: ="Text"
      BoardTitle:
        PropertyKind: Input
        DisplayName: Board Title
        Description: A custom property
        DataType: Text
        Default: ="Text"
      CutoverSchedule:
        PropertyKind: Input
        DisplayName: CutoverSchedule
        Description: A custom property
        DataType: Table
        Default: |
          =Table(
              {
                  EventName: "",
                  Phase: "",
                  StartDate: Date(2026, 1, 1),
                  FinishDate: Date(2026, 1, 1)
              }
          )
      ReadinessExceptions:
        PropertyKind: Input
        DisplayName: Readiness Exceptions
        Description: Dataverse readiness exception records
        DataType: Table
        Default: |-
          =Table({ 'Facility Mnemonic': "", 'Worksheet Name': "", 'Source Mnemonic': "", 'Readiness Status': "" })
      ReadinessSnapshots:
        PropertyKind: Input
        DisplayName: Readiness Snapshots
        Description: Dataverse readiness snapshot records
        DataType: Table
        Default: |-
          =Table({ 'Total Records': 0, 'Mapped Records': 0, 'No Match Records': 0, 'Readiness Percentage': 0, 'Facility Mnemonic': "", 'Worksheet Name': "", 'Data Current': true })
      ReadinessSummaries:
        PropertyKind: Input
        DisplayName: Readiness Summaries
        Description: Dataverse readiness status summaries
        DataType: Table
        Default: |-
          =Table({ 'Worksheet Name': "", 'Facility Mnemonic': "", 'Readiness Status': "", 'Record Count': 0 })
      Record:
        PropertyKind: Input
        DisplayName: Record
        Description: A custom property
        DataType: Text
        Default: ="Text"
      SelectedRecord:
        PropertyKind: Output
        DisplayName: Selected Record
        Description: A custom property
        DataType: Record
      WaveSubwave:
        PropertyKind: Input
        DisplayName: Wave - Subwave
        Description: A custom property
        DataType: Text
        Default: ="Text"
    Properties:
      Height: =700
      SelectedRecord: |-
        ={SampleStringField: "SampleText", SampleNumberField: 10, SampleBooleanField: true}
      Width: =1200
    Children:
      - shpReadinessDash:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =ColorValue("#03173E")
            Fill: '=ColorValue("#03173E") '
            Height: =80
            Width: =1200
      - shpReadinessSidePanel:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =ColorValue("#03173E")
            Fill: =ColorValue("#03173E")
            Height: =700
            Width: =100
      - lblReadinessSubTitle:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#E05929")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =14
            Text: ="Cutover Automation Configuration Readiness"
            VerticalAlign: =VerticalAlign.Top
            Width: =345
            X: =127
            Y: =44
      - lblReadinessDashTitle:
          Control: ModernText@1.0.0
          Properties:
            Color: =Color.White
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =44
            Size: =17
            Text: ="Expanse Cutover Automation Readiness Dashboard"
            VerticalAlign: =VerticalAlign.Top
            Width: =480
            X: =108
            Y: =7
      - txtLogoExpanse:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#E05929")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =50
            Size: =13
            Text: ="Expanse Automation"
            Width: =94
            X: =6
            Y: =53
      - imgHCALogo2:
          Control: Image@2.2.3
          Properties:
            BorderColor: =ColorValue("#03173E")
            Height: =42
            Image: =HCA_Healthcare_Logo_Extracted
            Width: =95
            X: =7
            Y: =7
      - lblRegEventDate:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Right
            AutoHeight: =true
            Color: =RGBA(9, 33, 98, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Semibold
            Text: |-
              =With(
                  {
                      nextEvent: First(
                          Sort(
                              Filter(
                                  colECCSCutoverSchedule,
                                  StartDate >= Today()
                              ),
                              StartDate,
                              SortOrder.Ascending
                          )
                      )
                  },
                  If(
                      IsBlank(nextEvent.StartDate),
                      "No milestone scheduled",
                      nextEvent.EventName &
                      " | " &
                      Text(
                          nextEvent.StartDate,
                          "[$-en-US]mmmm d, yyyy"
                      )
                  )
              )
            Width: =310
            X: =890
            Y: =83
      - lblRegCountdown:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            Color: =ColorValue("#E05929")
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =45
            Size: =22
            Text: |-
              =With(
                  {
                      nextEvent: First(
                          Sort(
                              Filter(
                                  colECCSCutoverSchedule,
                                  StartDate >= Now()
                              ),
                              StartDate,
                              SortOrder.Ascending
                          )
                      )
                  },
                  If(
                      IsBlank(nextEvent.StartDate),
                      "COUNTDOWN NOT CONFIGURED",
                      With(
                          {
                              totalMinutes: DateDiff(
                                  Now(),
                                  nextEvent.StartDate,
                                  TimeUnit.Minutes
                              )
                          },
                          If(
                              totalMinutes <= 0,
                              "EVENT ACTIVE",
                              Int(totalMinutes / 1440) &
                              "d " &
                              Mod(
                                  Int(totalMinutes / 60),
                                  24
                              ) &
                              "h " &
                              Mod(
                                  totalMinutes,
                                  60
                              ) &
                              "m"
                          )
                      )
                  )
              )
            Width: =210
            X: =940
            Y: =114
      - lblRegReadiness:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#03173E")
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =16
            Text: ="REGISTRATION READINESS"
            Width: =240
            X: =100
            Y: =82
      - lblREGDashTotalKPI:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =55
            Size: =24
            Text: =If(IsEmpty(Filter(cmpECCSCutoverReadinessDsh.ReadinessSnapshots, 'Data Current' = true && IsBlank('Facility Mnemonic') && IsBlank('Worksheet Name'))), "No data", Text(First(Filter(cmpECCSCutoverReadinessDsh.ReadinessSnapshots, 'Data Current' = true && IsBlank('Facility Mnemonic') && IsBlank('Worksheet Name'))).'Total Records', "#,##0"))
            Width: =220
            X: =125
            Y: =170
      - lblREGDashMappedKPI:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =55
            Size: =24
            Text: =If(IsEmpty(Filter(cmpECCSCutoverReadinessDsh.ReadinessSnapshots, 'Data Current' = true && IsBlank('Facility Mnemonic') && IsBlank('Worksheet Name'))), "No data", Text(First(Filter(cmpECCSCutoverReadinessDsh.ReadinessSnapshots, 'Data Current' = true && IsBlank('Facility Mnemonic') && IsBlank('Worksheet Name'))).'Mapped Records', "#,##0"))
            Width: =220
            X: =385
            Y: =170
      - lblREGDashNoMatchKPI:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#E05929")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =55
            Size: =24
            Text: =If(IsEmpty(Filter(cmpECCSCutoverReadinessDsh.ReadinessSnapshots, 'Data Current' = true && IsBlank('Facility Mnemonic') && IsBlank('Worksheet Name'))), "No data", Text(First(Filter(cmpECCSCutoverReadinessDsh.ReadinessSnapshots, 'Data Current' = true && IsBlank('Facility Mnemonic') && IsBlank('Worksheet Name'))).'No Match Records', "#,##0"))
            Width: =220
            X: =645
            Y: =170
      - lblREGDashReadinessKPI:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =55
            Size: =24
            Text: =If(IsEmpty(Filter(cmpECCSCutoverReadinessDsh.ReadinessSnapshots, 'Data Current' = true && IsBlank('Facility Mnemonic') && IsBlank('Worksheet Name'))), "No data", Text(First(Filter(cmpECCSCutoverReadinessDsh.ReadinessSnapshots, 'Data Current' = true && IsBlank('Facility Mnemonic') && IsBlank('Worksheet Name'))).'Readiness Percentage', "0.0") & "%")
            Width: =220
            X: =905
            Y: =170
      - lblREGDashTotalCaption:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#54585A")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =30
            Size: =11
            Text: ="TOTAL CONFIGURATION RECORDS"
            Width: =235
            X: =125
            Y: =140
      - lblREGDashMappedCaption:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#54585A")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =30
            Size: =11
            Text: ="MAPPED RECORDS"
            Width: =235
            X: =385
            Y: =140
      - lblREGDashNoMatchCaption:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#54585A")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =30
            Size: =11
            Text: ="NO MATCH RECORDS"
            Width: =235
            X: =645
            Y: =140
      - lblREGDashReadinessCaption:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#54585A")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =30
            Size: =11
            Text: ="MAPPING READINESS"
            Width: =235
            X: =905
            Y: =140
      - lblREGWorksheetChartTitle:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =14
            Text: ="READINESS BY WORKSHEET"
            Width: =450
            X: =125
            Y: =265
      - lblREGFacilityChartTitle:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =14
            Text: ="READINESS BY FACILITY"
            Width: =450
            X: =645
            Y: =265
      - lblREGExceptionsTitle:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =14
            Text: ="EXCEPTIONS / NO MATCH"
            Width: =450
            X: =127
            Y: =502
      - galREGWorksheetReadiness:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
          Properties:
            Height: =185
            Items: |
              =
              With(
                  {
                      grouped: GroupBy(
                          cmpECCSCutoverReadinessDsh.ReadinessSummaries,
                          'Worksheet Name',
                          StatusRows
                      )
                  },
                  AddColumns(
                      grouped As ws,
                      MappedCount,
                      Sum(
                          Filter(
                              ws.StatusRows,
                              'Readiness Status' = "Mapped"
                          ),
                          'Record Count'
                      ),
                      NeedsCount,
                      Sum(
                          Filter(
                              ws.StatusRows,
                              'Readiness Status' = "Needs Mapping"
                          ),
                          'Record Count'
                      ),
                      IncompleteCount,
                      Sum(
                          Filter(
                              ws.StatusRows,
                              'Readiness Status' = "Incomplete"
                          ),
                          'Record Count'
                      )
                  )
              )
            TemplateSize: =42
            Width: =480
            X: =125
            Y: =305
          Children:
            - shpREGWorksheetMappedBar:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =ColorValue("#03173E")
                  Height: =14
                  Width: =If(Sum(ThisItem.StatusRows, 'Record Count') = 0, 0, 225 * Sum(Filter(ThisItem.StatusRows, 'Readiness Status' = "Mapped"), 'Record Count') / Sum(ThisItem.StatusRows, 'Record Count'))
                  X: =235
                  Y: =14
            - shpREGWorksheetNeedsMappingBar:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =ColorValue("#E05929")
                  Height: =14
                  Width: |+
                    =Max(
                        0,
                        600 * ThisItem.MappedCount /
                        Max(
                            1,
                            ThisItem.MappedCount +
                            ThisItem.NeedsCount +
                            ThisItem.IncompleteCount
                        )
                    )
                  X: =235 + shpREGWorksheetMappedBar.Width
                  Y: =14
            - shpREGWorksheetIncompleteBar:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =ColorValue("#AEB5BF")
                  Height: =14
                  Width: =If(Sum(ThisItem.StatusRows, 'Record Count') = 0, 0, 225 * Sum(Filter(ThisItem.StatusRows, 'Readiness Status' = "Incomplete Target"), 'Record Count') / Sum(ThisItem.StatusRows, 'Record Count'))
                  X: =shpREGWorksheetNeedsMappingBar.X + shpREGWorksheetNeedsMappingBar.Width
                  Y: =14
            - lblREGWorksheetRow:
                Control: ModernText@1.0.0
                Properties:
                  Color: =ColorValue("#03173E")
                  Font: =Font.'Open Sans'
                  Height: =30
                  Size: =11
                  Text: =ThisItem.'Worksheet Name'
                  Width: =230
                  X: =5
                  Y: =5
      - galREGFacilityReadiness:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
          Properties:
            Height: =185
            Items: |
              =
              With(
                  {
                      grouped: GroupBy(
                          cmpECCSCutoverReadinessDsh.ReadinessSummaries,
                          'Facility Mnemonic',
                          StatusRows
                      )
                  },
                  AddColumns(
                      grouped As fac,
                      MappedCount,
                      Coalesce(
                          Sum(
                              Filter(
                                  fac.StatusRows,
                                  'Readiness Status' = "Mapped"
                              ),
                              'Record Count'
                          ),
                          0
                      ),
                      NeedsCount,
                      Coalesce(
                          Sum(
                              Filter(
                                  fac.StatusRows,
                                  'Readiness Status' = "Needs Mapping"
                              ),
                              'Record Count'
                          ),
                          0
                      ),
                      IncompleteCount,
                      Coalesce(
                          Sum(
                              Filter(
                                  fac.StatusRows,
                                  'Readiness Status' = "Incomplete"
                              ),
                              'Record Count'
                          ),
                          0
                      )
                  )
              )
            TemplateSize: =42
            Width: =480
            X: =645
            Y: =305
          Children:
            - shpREGFacilityMappedBar:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =ColorValue("#03173E")
                  Height: =14
                  Width: =If(Sum(ThisItem.StatusRows, 'Record Count') = 0, 0, 225 * Sum(Filter(ThisItem.StatusRows, 'Readiness Status' = "Mapped"), 'Record Count') / Sum(ThisItem.StatusRows, 'Record Count'))
                  X: =235
                  Y: =14
            - shpREGFacilityNeedsMappingBar:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =ColorValue("#E05929")
                  Height: =14
                  Width: =If(Sum(ThisItem.StatusRows, 'Record Count') = 0, 0, 225 * Sum(Filter(ThisItem.StatusRows, 'Readiness Status' = "Needs Mapping"), 'Record Count') / Sum(ThisItem.StatusRows, 'Record Count'))
                  X: =235 + shpREGFacilityMappedBar.Width
                  Y: =14
            - shpREGFacilityIncompleteBar:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =ColorValue("#AEB5BF")
                  Height: =14
                  Width: =If(Sum(ThisItem.StatusRows, 'Record Count') = 0, 0, 225 * Sum(Filter(ThisItem.StatusRows, 'Readiness Status' = "Incomplete Target"), 'Record Count') / Sum(ThisItem.StatusRows, 'Record Count'))
                  X: =shpREGFacilityNeedsMappingBar.X + shpREGFacilityNeedsMappingBar.Width
                  Y: =14
            - lblREGFacilityRow:
                Control: ModernText@1.0.0
                Properties:
                  Color: =ColorValue("#03173E")
                  Font: =Font.'Open Sans'
                  Height: =30
                  Size: =11
                  Text: =ThisItem.'Facility Mnemonic'
                  Width: =230
                  X: =5
                  Y: =5
      - galREGReadinessExceptions:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
          Properties:
            Height: =128
            Items: |+
              =
              cmpECCSCutoverReadinessDsh.ReadinessExceptions
            TemplateSize: =42
            Width: =1062
            X: =125
            Y: =547
          Children:
            - lblREGExceptionRow:
                Control: ModernText@1.0.0
                Properties:
                  Color: =ColorValue("#54585A")
                  Font: =Font.'Open Sans'
                  Height: =30
                  Size: =11
                  Text: =ThisItem.'Facility Mnemonic'
                  Width: =970
                  X: =5
                  Y: =5

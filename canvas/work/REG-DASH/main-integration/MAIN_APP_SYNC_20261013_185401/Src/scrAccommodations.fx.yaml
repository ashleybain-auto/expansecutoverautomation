        =Set(
            gblSelectedWorksheet,
            ""
        );
        
        Set(
            gblSelectedEnvironment,
            "Expanse TEST"
        );
        
        Set(
            gblSelectedAccommodation,
            Blank()
        );
        
        Set(
            gblEditMode,
            false
        );
        
        Set(
            gblSyncConfirmed,
            false
        );
        
        Set(
            gblShowSyncPrompt,
            false

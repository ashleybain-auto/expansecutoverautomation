    "galREGWorksheetReadiness As gallery.'BrowseLayout_Vertical_OneTextVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtered"
        BorderColor: =App.Theme.Colors.Darker40
        DelayItemLoading: =true
        Height: =185
        Items: |
            =
            With(
                {
                    grouped: GroupBy(
                        cmpECCSCutoverReadinessDsh.ReadinessSummaries,
                        'Worksheet Name',
                        StatusRows
                    )
                },
                AddColumns(
                    grouped As ws,
                    MappedCount,
                    Sum(
                        Filter(
                            ws.StatusRows,
                            'Readiness Status' = "Mapped"
                        ),
                        'Record Count'
                    ),
                    NeedsCount,
                    Sum(
                        Filter(
                            ws.StatusRows,
                            'Readiness Status' = "Needs Mapping"
                        ),
                        'Record Count'
                    ),
                    IncompleteCount,
                    Sum(
                        Filter(
                            ws.StatusRows,
                            'Readiness Status' = "Incomplete"
                        ),
                        'Record Count'
                    )
                )
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =42
        Width: =480
        X: =125
        Y: =305
        ZIndex: =21

        shpREGWorksheetMappedBar As rectangle:
            BorderColor: =App.Theme.Colors.Darker40
            Fill: |-
                =ColorValue("#03173E")
            Height: =14
            Width: =If(Sum(ThisItem.StatusRows, 'Record Count') = 0, 0, 225 * Sum(Filter(ThisItem.StatusRows, 'Readiness Status' = "Mapped"), 'Record Count') / Sum(ThisItem.StatusRows, 'Record Count'))
            X: =235
            Y: =14
            ZIndex: =1

        shpREGWorksheetNeedsMappingBar As rectangle:
            BorderColor: =App.Theme.Colors.Darker40
            Fill: |-
                =ColorValue("#E05929")
            Height: =14
            Width: |
                =Max(
                    0,
                    600 * ThisItem.MappedCount /
                    Max(
                        1,
                        ThisItem.MappedCount +
                        ThisItem.NeedsCount +
                        ThisItem.IncompleteCount
                    )
                )
            X: =235 + shpREGWorksheetMappedBar.Width
            Y: =14
            ZIndex: =2

        shpREGWorksheetIncompleteBar As rectangle:
            BorderColor: =App.Theme.Colors.Darker40
            Fill: |-
                =ColorValue("#AEB5BF")
            Height: =14
            Width: =If(Sum(ThisItem.StatusRows, 'Record Count') = 0, 0, 225 * Sum(Filter(ThisItem.StatusRows, 'Readiness Status' = "Incomplete Target"), 'Record Count') / Sum(ThisItem.StatusRows, 'Record Count'))
            X: =shpREGWorksheetNeedsMappingBar.X + shpREGWorksheetNeedsMappingBar.Width
            Y: =14
            ZIndex: =3

        lblREGWorksheetRow As modernText:
            BorderStyle: =""
            Color: |-
                =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            Height: =30
            Size: =11
            Text: =ThisItem.'Worksheet Name'
            Width: =230
            X: =5
            Y: =5
            ZIndex: =4

    "galREGFacilityReadiness As gallery.'BrowseLayout_Vertical_OneTextVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtered"
        BorderColor: =App.Theme.Colors.Darker40
        DelayItemLoading: =true
        Height: =185
        Items: |
            =
            With(
                {
                    grouped: GroupBy(
                        cmpECCSCutoverReadinessDsh.ReadinessSummaries,
                        'Facility Mnemonic',
                        StatusRows
                    )
                },
                AddColumns(
                    grouped As fac,
                    MappedCount,
                    Coalesce(
                        Sum(
                            Filter(
                                fac.StatusRows,
                                'Readiness Status' = "Mapped"
                            ),
                            'Record Count'
                        ),
                        0
                    ),
                    NeedsCount,
                    Coalesce(
                        Sum(
                            Filter(
                                fac.StatusRows,
                                'Readiness Status' = "Needs Mapping"
                            ),
                            'Record Count'
                        ),
                        0
                    ),
                    IncompleteCount,
                    Coalesce(
                        Sum(
                            Filter(
                                fac.StatusRows,
                                'Readiness Status' = "Incomplete"
                            ),
                            'Record Count'
                        ),
                        0
                    )
                )
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =42
        Width: =480
        X: =645
        Y: =305
        ZIndex: =22

        shpREGFacilityMappedBar As rectangle:
            BorderColor: =App.Theme.Colors.Darker40

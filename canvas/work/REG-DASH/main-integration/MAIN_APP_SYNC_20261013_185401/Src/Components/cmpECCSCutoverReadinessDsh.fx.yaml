cmpECCSCutoverReadinessDsh As CanvasComponent:
    BoardSubtitle: ="Text"
    BoardTitle: ="Text"
    ChildTabPriority: =true
    ContentLanguage: =""
    CutoverSchedule: |
        =Table(
            {
                EventName: "",
                Phase: "",
                StartDate: Date(2026, 1, 1),
                FinishDate: Date(2026, 1, 1)
            }
        )
    EnableChildFocus: =true
    Fill: =RGBA(0, 0, 0, 0)
    Height: =700
    ReadinessExceptions: |-
        =Table({ 'Facility Mnemonic': "", 'Worksheet Name': "", 'Source Mnemonic': "", 'Readiness Status': "" })
    ReadinessSnapshots: |-
        =Table({ 'Total Records': 0, 'Mapped Records': 0, 'No Match Records': 0, 'Readiness Percentage': 0, 'Facility Mnemonic': "", 'Worksheet Name': "", 'Data Current': true })
    ReadinessSummaries: |-
        =Table({ 'Worksheet Name': "", 'Facility Mnemonic': "", 'Readiness Status': "", 'Record Count': 0 })
    Record: ="Text"
    SelectedRecord: |-
        ={SampleStringField: "SampleText", SampleNumberField: 10, SampleBooleanField: true}
    Visible: =true
    WaveSubwave: ="Text"
    Width: =1200
    X: =0
    Y: =0

    shpReadinessDash As rectangle:
        BorderColor: |-
            =ColorValue("#03173E")
        Fill: |-
            =ColorValue("#03173E") 
        Height: =80
        Width: =1200
        ZIndex: =1

    shpReadinessSidePanel As rectangle:

ComponentDefinitions:
  cmpDrpdwnFiltersFacilityWksG:
    DefinitionType: CanvasComponent
    Description: Wave Facility Dropdown
    AccessAppScope: true
    CustomProperties:
      BoardSubtitle:
        PropertyKind: Input
        DisplayName: Board Subtitle
        Description: '"Expanse Automation"'
        DataType: Text
        Default: ="Text"
      BoardTitle:
        PropertyKind: Input
        DisplayName: Board Title
        Description: '"Expanse Cutover Configuration Suite'
        DataType: Text
        Default: ="Text"
      FacilityMnemonicName:
        PropertyKind: Input
        DisplayName: Facility Mnemonic/Name
        Description: '"Facility Mnemonic/Name"'
        RaiseOnReset: true
        DataType: Text
        Default: ="Text"
      Records:
        PropertyKind: Input
        DisplayName: Records
        Description: '"Results"'
        RaiseOnReset: true
        DataType: Text
        Default: ="Text"
      ResetSelections:
        PropertyKind: Event
        DisplayName: Reset Selections
        Description: A custom property
        ReturnType: None
        Default: =true
      SelectedRecord:
        PropertyKind: Output
        DisplayName: Selected Record
        Description: '""'
        DataType: Record
      WaveSubwave:
        PropertyKind: Input
        DisplayName: Wave-Subwave
        Description: '"Wave-Subwave"'
        RaiseOnReset: true
        DataType: Text
        Default: ="Text"
      WorksheetName:
        PropertyKind: Input
        DisplayName: WorksheetName
        Description: '"Worksheet Name"'
        RaiseOnReset: true
        DataType: Text
        Default: ="Text"
    Properties:
      Height: =685
      SelectedRecord: =galWaveFacilityWkstGlobal.Selected
      Width: =655
    Children:
      - galWaveFacilityWkstGlobal:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 89, 178, 1)
            Height: =472
            Items: |-
              =With(
                  {
                      _records:
                          Switch(
                              Substitute(
                                  Trim(
                                      Coalesce(
                                          cmpDrpdwnFiltersFacilityWksG.WorksheetName,
                                          ""
                                      )
                                  ),
                                  "REG ",
                                  ""
                              ),

                              "Accommodations",
                                  ForAll(
                                      Filter(
                                          'Accommodation Data Clone',
                                          FacilityMnem_Source =
                                              cmpDrpdwnFiltersFacilityWksG.FacilityMnemonicName
                                      ),
                                      {
                                          RecordKey: Text(ECCS_Clone_RowId),
                                          WorksheetName: "Accommodations",
                                          SourceFacility: Coalesce(FacilityMnem_Source, ""),
                                          SourceMnemonic: Coalesce(Accommodation_Mnem_Source, ""),
                                          SourceName: Coalesce(Accommodation_Name_Source, ""),
                                          SourcePACode: Coalesce(PA_Code_Source, ""),
                                          SourceActive: Text(Active_Source),
                                          TargetFacility: Coalesce(FacilityMnem_Target, ""),
                                          TargetMnemonic: Coalesce(Accommodation_Mnem_Target, ""),
                                          TargetName: Coalesce(Accommodation_Name_Target, ""),
                                          TargetPACode: Coalesce(PA_Code_Target, ""),
                                          TargetActive: Coalesce(Text(Active_Target), ""),
                                          TargetMatchMtx: Coalesce(TargetMatchMtx, ""),
                                          ReadOnly: false
                                      }
                                  ),

                              "Locations",
                                  ForAll(
                                      Filter(
                                          Locations,
                                          'Source Facility Mnemonic' =
                                              cmpDrpdwnFiltersFacilityWksG.FacilityMnemonicName
                                      ),
                                      {
                                          RecordKey:
                                              Coalesce('Source Facility Mnemonic', "") &
                                              "|" &
                                              Coalesce('Source Location Mnemonic', ""),
                                          WorksheetName: "Locations",
                                          SourceFacility: Coalesce('Source Facility Mnemonic', ""),
                                          SourceMnemonic: Coalesce('Source Location Mnemonic', ""),
                                          SourceName: Coalesce('Source Location Name', ""),
                                          SourcePACode: Coalesce('Source PA Code', ""),
                                          SourceActive: Coalesce('Source Location Active', ""),
                                          TargetFacility: Coalesce('Target Facility Mnemonic', ""),
                                          TargetMnemonic: Coalesce('Target Location Mnemonic', ""),
                                          TargetName: Coalesce('Target Location Name', ""),
                                          TargetPACode: Coalesce('Target PA Code', ""),
                                          TargetActive: Coalesce('Target Location Active', ""),
                                          TargetMatchMtx: Coalesce('Target Match Matrix', ""),
                                          ReadOnly: false
                                      }
                                  ),

                              "Services",
                                  ForAll(
                                      Filter(
                                          Services,
                                          'Source Facility Mnemonic' =
                                              cmpDrpdwnFiltersFacilityWksG.FacilityMnemonicName
                                      ),
                                      {
                                          RecordKey:
                                              Coalesce('Source Facility Mnemonic', "") &
                                              "|" &
                                              Coalesce('Source Service Mnemonic', ""),
                                          WorksheetName: "Services",
                                          SourceFacility: Coalesce('Source Facility Mnemonic', ""),
                                          SourceMnemonic: Coalesce('Source Service Mnemonic', ""),
                                          SourceName: Coalesce('Source Service Name', ""),
                                          SourcePACode: Coalesce('Source Service PA Code', ""),
                                          SourceActive: Text('Source Active Status'),
                                          TargetFacility: Coalesce('Target Facility Mnemonic', ""),
                                          TargetMnemonic: Coalesce('Target Service Mnemonic', ""),
                                          TargetName: Coalesce('Target Service Name', ""),
                                          TargetPACode: Coalesce('Target Service PA Code', ""),
                                          TargetActive: Text('Target Active Status'),
                                          TargetMatchMtx: Coalesce('Target Match Matrix', ""),
                                          ReadOnly: false
                                      }
                                  ),

                              "Insurance",
                                  ForAll(
                                      Filter(
                                          Insurances,
                                          'Source Facility Mnemonic' =
                                              cmpDrpdwnFiltersFacilityWksG.FacilityMnemonicName
                                      ),
                                      {
                                          RecordKey:
                                              Coalesce('Source Facility Mnemonic', "") &
                                              "|" &
                                              Coalesce('Source Mnemonic', ""),

                                          WorksheetName: "Insurance",

                                          SourceFacility:
                                              Coalesce(
                                                  'Source Facility Mnemonic',
                                                  ""
                                              ),

                                          SourceMnemonic:
                                              Coalesce(
                                                  'Source Mnemonic',
                                                  ""
                                              ),

                                          SourceName:
                                              Coalesce(
                                                  'Source Description',
                                                  ""
                                              ),

                                          SourcePACode:
                                              Coalesce(
                                                  'Source PA Code',
                                                  ""
                                              ),

                                          SourceActive:
                                              Coalesce(
                                                  'Source Active Status',
                                                  ""
                                              ),

                                          TargetFacility:
                                              Coalesce(
                                                  'Target Facility Mnemonic',
                                                  ""
                                              ),

                                          TargetMnemonic:
                                              Coalesce(
                                                  'Target Mnemonic',
                                                  ""
                                              ),

                                          TargetName:
                                              Coalesce(
                                                  'Target Description',
                                                  ""
                                              ),

                                          TargetPACode:
                                              Coalesce(
                                                  'Target PA Code',
                                                  ""
                                              ),

                                          TargetActive:
                                              Coalesce(
                                                  'Target Active Status',
                                                  ""
                                              ),

                                          TargetMatchMtx:
                                              Coalesce(
                                                  'Target Match Matrix',
                                                  ""
                                              ),

                                          ReadOnly: false
                                      }
                                  ),

                              FirstN(
                                  Table(
                                      {
                                          RecordKey: "",
                                          WorksheetName: "",
                                          SourceFacility: "",
                                          SourceMnemonic: "",
                                          SourceName: "",
                                          SourcePACode: "",
                                          SourceActive: "",
                                          TargetFacility: "",
                                          TargetMnemonic: "",
                                          TargetName: "",
                                          TargetPACode: "",
                                          TargetActive: "",
                                          TargetMatchMtx: "",
                                          ReadOnly: true
                                      }
                                  ),
                                  0
                              )
                          )
                  },

                  With(
                      {
                          _search:
                              Lower(
                                  Trim(
                                      txtRegSearchG.Text
                                  )
                              ),

                          _needle:
                              Lower(
                                  Substitute(
                                      Trim(
                                          txtRegSearchG.Text
                                      ),
                                      "*",
                                      ""
                                  )
                              )
                      },

                      Filter(
                          _records,

                          IsBlank(_search) ||

                          _search = "*" ||

                          IsBlank(_needle) ||

                          _needle in Lower(
                              Coalesce(RecordKey, "") & " " &
                              Coalesce(SourceFacility, "") & " " &
                              Coalesce(SourceMnemonic, "") & " " &
                              Coalesce(SourceName, "") & " " &
                              Coalesce(SourcePACode, "") & " " &
                              Coalesce(SourceActive, "") & " " &
                              Coalesce(TargetFacility, "") & " " &
                              Coalesce(TargetMnemonic, "") & " " &
                              Coalesce(TargetName, "") & " " &
                              Coalesce(TargetPACode, "") & " " &
                              Coalesce(TargetActive, "") & " " &
                              Coalesce(TargetMatchMtx, "")
                          )
                      )
                  )
              )
            TemplateSize: =65
            Width: =638
            WrapCount: =2
            X: =8
            Y: =203
          Children:
            - Title5:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =20
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =ThisItem.SourceFacility
                  VerticalAlign: =VerticalAlign.Top
                  Width: =260
                  X: =8
                  Y: =
            - Subtitle4:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =20
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =ThisItem.SourceName
                  VerticalAlign: =VerticalAlign.Top
                  Width: =260
                  X: =8
                  Y: =20
            - Body3:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =20
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =ThisItem.SourceMnemonic
                  VerticalAlign: =VerticalAlign.Top
                  Width: =260
                  X: =8
                  Y: =40
            - NextArrow5:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =Self.Tooltip
                  BorderColor: =RGBA(0, 89, 178, 1)
                  Color: =RGBA(166, 166, 166, 1)
                  Height: =50
                  Icon: =Icon.ChevronRight
                  OnSelect: =Select(Parent)
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Tooltip: ="View item details"
                  Width: =50
                  X: =Parent.TemplateWidth - Self.Width - 12
                  Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            - Separator5:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 89, 178, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =2
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - Rectangle4:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 89, 178, 1)
                  Fill: =RGBA(0, 89, 178, 1)
                  Height: =Parent.TemplateHeight - Separator5.Height
                  OnSelect: =Select(Parent)
                  Visible: =ThisItem.IsSelected
                  Width: =4
      - drpWaveSubWaveG:
          Control: ModernDropdown@1.0.3
          Properties:
            Font: =Font.'Open Sans'
            ItemDisplayText: =ThisItem.Value
            Items: |-
              =Sort(
                  Distinct(
                      Filter(
                          'dim.Ref.Organizations',
                          !IsBlank('Wave Number') &&
                          'Wave Number' <> "Wave" &&
                          'Wave Number' <> "NULL" &&
                          !IsBlank('SubWave2 Code') &&
                          'SubWave2 Code' <> "SubWave" &&
                          'SubWave2 Code' <> "NULL"
                      ),
                      'Wave Number' & " - " & 'SubWave2 Code'
                  ),
                  Value,
                  SortOrder.Ascending
              )
            OnChange: |-
              =Set(
                  gblSelectedWaveNumber,
                  First(
                      Split(
                          drpWaveSubWaveG.Selected.Value,
                          " - "
                      )
                  ).Value
              );
              Set(
                  gblSelectedSubWaveCode,
                  Last(
                      Split(
                          drpWaveSubWaveG.Selected.Value,
                          " - "
                      )
                  ).Value
              );
              Set(
                  gblSelectedFacility,
                  Blank()
              );
              Set(
                  gblSelectedNetworkMnemonic,
                  Blank()
              );
              Reset(txtRegSearchG)
            Size: =13
            Width: =210
            X: =8
            Y: =32
      - lblGlbWaveSubwaveG:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =14
            Text: ="WAVE - SUBWAVE"
            Width: =240
            X: =5
            Y: =3
      - drpFacilityMnemNameG:
          Control: ModernDropdown@1.0.3
          Properties:
            Font: =Font.'Open Sans'
            ItemDisplayText: =ThisItem.'Facility Mnemonic'
            Items: |
              =
              Sort(
                  Filter(
                      'dim.Ref.Organizations',
                      !IsBlank('Facility Mnemonic') &&
                      'Facility Mnemonic' <> "Facility Mnemonic" &&
                      'Facility Mnemonic' <> "NULL" &&
                      (
                          IsBlank(gblSelectedWaveNumber) ||
                          'Wave Number' = gblSelectedWaveNumber
                      ) &&
                      (
                          IsBlank(gblSelectedSubWaveCode) ||
                          'SubWave2 Code' = gblSelectedSubWaveCode
                      )
                  ),
                  'Facility Mnemonic',
                  SortOrder.Ascending
              )
            OnChange: |-
              =Set(
                  gblSelectedFacility,
                  drpFacilityMnemNameG.Selected.'Facility Mnemonic'
              );
              Set(
                  gblSelectedNetworkMnemonic,
                  drpFacilityMnemNameG.Selected.'Network Mnemonic'
              );
              Reset(txtRegSearchG)
            Size: =13
            Width: =285
            X: =325
            Y: =32
      - lblGlbFacilityMneNameG:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =14
            Text: ="FACILITY MNEMONIC/NAME"
            Width: =250
            X: =325
            Y: =3
      - drpRegWorksheetG:
          Control: ModernDropdown@1.0.3
          Properties:
            Font: =Font.'Open Sans'
            ItemDisplayText: =ThisItem.'Reg Worksheet Name'
            Items: |
              =
              Sort(
                  Filter(
                      'Reg Config Categories',
                      'Reg Worksheet Name' <> "REG ALL" &&
                      'Reg Worksheet Name' <> "REG [INSERT-UPLOAD]"
                  ),
                  'Reg Worksheet Name',
                  SortOrder.Ascending
              )
            OnChange: |-
              =Set(
                  gblSelectedWorksheet,
                  drpRegWorksheetG.Selected.'Reg Worksheet Name'
              );
              Reset(txtRegSearchG)
            Size: =13
            Width: =280
            X: =8
            Y: =102
      - lblRegWorksheetsG:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =34
            Size: =14
            Text: ="REG WORKSHEET NAME"
            Width: =200
            X: =5
            Y: =68
      - txtRegSearchG:
          Control: ModernTextInput@1.1.2
          Properties:
            AccessibleLabel: =
            Font: =Font.'Open Sans'
            Placeholder: ="Search (* = wildcard)"
            Size: =13
            TriggerOutput: =TriggerOutput.Delayed
            Type: =TextInputType.Search
            Width: =285
            X: =325
            Y: =99
      - lblResultsCountG:
          Control: ModernText@1.0.0
          Properties:
            Color: =RGBA(52, 152, 47, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Text: |-
              =CountRows(
                  galWaveFacilityWkstGlobal.AllItems
              ) & " "
            Width: =65
            X: =486
            Y: =137
      - lblResultsG:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =35
            Size: =14
            Text: ="RESULTS:"
            Width: =81
            X: =384
            Y: =139

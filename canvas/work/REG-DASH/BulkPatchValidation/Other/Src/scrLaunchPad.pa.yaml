Screens:
  scrLaunchPad:
    Properties:
      Fill: =ColorValue("#F5F6F7")
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
      OnVisible: |-
        =ClearCollect(
            colLaunchModules,
            {
                ModuleKey: "REG",
                ModuleName: "Registration",
                Description: "Registration configuration",
                Available: true
            },
            {
                ModuleKey: "PHA",
                ModuleName: "PHA",
                Description: "Pharmacy",
                Available: true
            },
            {
                ModuleKey: "NONMED",
                ModuleName: "Non-Med",
                Description: "Procedures and Queries",
                Available: true
            },
            {
                ModuleKey: "RAD",
                ModuleName: "RAD",
                Description: "Radiology",
                Available: true
            },
            {
                ModuleKey: "LAB",
                ModuleName: "LAB",
                Description: "Laboratory",
                Available: true
            },
            {
                ModuleKey: "DIET",
                ModuleName: "Diet",
                Description: "Nutrition",
                Available: true
            },
            {
                ModuleKey: "LOC",
                ModuleName: "Level of Care",
                Description: "Patient Care",
                Available: true
            },
            {
                ModuleKey: "CNET",
                ModuleName: "CNET",
                Description: "Cutover Nursing Entry Tool",
                Available: false
            }
        )
    Children:
      - cmpECCSNavigationBarTop_3:
          Control: CanvasComponent
          ComponentName: cmpECCSNavigationBarTop
          Properties:
            Height: =36
            OnReportsSelect: =
            Width: =620
            X: =746
            Y: =37
      - shpLaunchHeader:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =ColorValue("#03173E")
            Fill: =ColorValue("#03173E")
            Height: =110
            Width: =Parent.Width
      - lblLaunchTitle:
          Control: ModernText@1.0.0
          Properties:
            Color: =Color.White
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =40
            Size: =20
            Text: ="Expanse Cutover Automation Configuration Suite"
            Width: =550
            X: =110
            Y: =7
      - lblLaunchSubtitle:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#E05929")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =36
            Text: ="Centralized tools for configuration mapping, validation, and updates across Expanse."
            VerticalAlign: =VerticalAlign.Top
            Width: =650
            X: =102
            Y: =63
      - shpLaunchRail:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =ColorValue("#03173E")
            Fill: =ColorValue("#03173E")
            FocusedBorderColor: =
            Height: =Parent.Height
            Width: =100
      - galRecentActivity:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
          Properties:
            BorderColor: =RGBA(217, 221, 226, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =145
            Items: |-
              =Table(
                  {
                      ActivityDate: "9/11/2026",
                      Tool: "Registration",
                      Activity: "Uploaded Registration_Source.xlsx",
                      Status: "Completed"
                  },
                  {
                      ActivityDate: "9/11/2026",
                      Tool: "PHA",
                      Activity: "Ran validation",
                      Status: "Completed"
                  },
                  {
                      ActivityDate: "9/10/2026",
                      Tool: "Non-Med",
                      Activity: "Pushed 245 updates to TEST",
                      Status: "Completed"
                  }
              )
            OnSelect: =lblExpandSelect
            ShowScrollbar: =false
            TemplateSize: =50
            Width: =802
            X: =110
            Y: =607
          Children:
            - Title4:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  Font: =Font.Arial
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: =ThisItem.Activity
                  VerticalAlign: =VerticalAlign.Top
                  Visible: =false
                  Width: =Parent.TemplateWidth - 86
                  X: =16
                  Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            - NextArrow4:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =Self.Tooltip
                  BorderColor: =ColorValue("#03173E")
                  Color: =RGBA(166, 166, 166, 1)
                  Height: =42
                  Icon: =Icon.ChevronRight
                  OnSelect: =Select(Parent)
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  Tooltip: ="View item details"
                  Visible: =false
                  Width: =50
                  X: =Parent.TemplateWidth - Self.Width - 12
            - Separator4:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =ColorValue("#03173E")
                  Fill: =RGBA(255, 255, 255, 1)
                  FocusedBorderThickness: =1
                  Height: =2
                  OnSelect: =Select(Parent)
                  Visible: =false
                  Width: =Parent.TemplateWidth
                  Y: =40
            - Rectangle13:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =ColorValue("#03173E")
                  Fill: =RGBA(0, 89, 178, 1)
                  Height: =Parent.TemplateHeight - Separator4.Height
                  OnSelect: =Select(Parent)
                  Visible: =ThisItem.IsSelected
                  Width: =4
            - lblActivityDate:
                Control: ModernText@1.0.0
                Properties:
                  Color: =RGBA(84, 88, 90, 1)
                  Font: =Font.Arial
                  Height: =24
                  OnSelect: =Select(Parent)
                  Size: =9
                  Text: =ThisItem.ActivityDate
                  Width: =100
                  X: =10
                  Y: =8
            - lblActivityTool:
                Control: ModernText@1.0.0
                Properties:
                  Color: =RGBA(3, 23, 62, 1)
                  Font: =Font.Arial
                  FontWeight: =FontWeight.Bold
                  Height: =24
                  OnSelect: =Select(Parent)
                  Size: =9
                  Text: =ThisItem.Tool
                  Width: =120
                  X: =120
                  Y: =7
            - lblActivityDescription:
                Control: ModernText@1.0.0
                Properties:
                  Color: =RGBA(84, 88, 90, 1)
                  Font: =Font.Arial
                  Height: =24
                  OnSelect: =Select(Parent)
                  Size: =9
                  Text: =ThisItem.Activity
                  Width: =285
                  X: =250
                  Y: =8
            - lblActivityStatus:
                Control: ModernText@1.0.0
                Properties:
                  Color: |-
                    =If(
                        ThisItem.Status = "Completed",
                        RGBA(0, 140, 69, 1),
                        RGBA(224, 89, 41, 1)
                    )
                  Font: =Font.Arial
                  FontWeight: =FontWeight.Bold
                  Height: =24
                  OnSelect: =Select(Parent)
                  Size: =9
                  Text: =ThisItem.Status
                  Width: =75
                  X: =670
                  Y: =8
            - lblRecentActivityTitle:
                Control: ModernText@1.0.0
                Properties:
                  Color: =RGBA(3, 23, 62, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Height: =24
                  PaddingBottom: =2
                  PaddingLeft: =2
                  PaddingRight: =2
                  PaddingTop: =2
                  Size: =14
                  Text: ="Recent Activity"
                  Visible: =false
                  Width: =300
                  X: =460
                  Y: =505
            - shpActivitySeparator:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =ColorValue("#03173E")
                  Fill: =RGBA(217, 221, 226, 1)
                  Height: =1
                  OnSelect: =Select(Parent)
                  Width: =820
                  Y: =40
      - lblActivityDateHeader:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =RGBA(84, 88, 90, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =20
            Size: =9
            Text: ="DATE"
            Width: =100
            X: =120
            Y: =584
      - lblActivityToolHeader:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =RGBA(84, 88, 90, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =20
            Size: =9
            Text: ="TOOL"
            Width: =120
            X: =230
            Y: =584
      - lblActivityDescriptionHeader:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =RGBA(84, 88, 90, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =20
            Size: =9
            Text: ="ACTIVITY"
            Width: =420
            X: =350
            Y: =584
      - lblActivityStatusHeader:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =RGBA(84, 88, 90, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =20
            Size: =9
            Text: ="STATUS"
            Width: =50
            X: =782
            Y: =584
      - galLaunchModules:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =ColorValue("#03173E")
            Height: =410
            Items: =colLaunchModules
            OnSelect: |-
              =Switch(
                  ThisItem.ModuleKey,
                  "REG",
                      Navigate(
                          scrRegistrationLaunchpad,
                          ScreenTransition.Fade
                      ),
                  "CNET",
                      Notify(
                          "CNET is coming soon.",
                          NotificationType.Information
                      ),
                  Notify(
                      ThisItem.ModuleName & " workspace is coming soon.",
                      NotificationType.Information
                  )
              )
            TemplatePadding: =7
            TemplateSize: =120
            Width: =1222
            WrapCount: =4
            X: =134
            Y: =114
          Children:
            - shpModuleTile:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(217, 221, 226, 1)
                  BorderThickness: =1
                  Fill: |-
                    =If(
                        ThisItem.Available,
                        RGBA(255, 255, 255, 1),
                        RGBA(232, 234, 236, 1)
                    )
                  Height: =105
                  OnSelect: =Select(Parent)
                  Width: =267
                  X: =8
                  Y: =8
            - lblModuleName:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: |-
                    =If(
                        ThisItem.Available,
                        RGBA(3, 23, 62, 1),
                        RGBA(135, 141, 146, 1)
                    )
                  Fill: =RGBA(0, 0, 0, 0)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Height: =26
                  OnSelect: =Select(Parent)
                  Size: =16
                  Text: =ThisItem.ModuleName
                  Width: =165
                  X: =10
                  Y: =12
            - lblModuleDescription:
                Control: ModernText@1.0.0
                Properties:
                  Color: |-
                    =If(
                        ThisItem.Available,
                        RGBA(84, 88, 90, 1),
                        RGBA(135, 141, 146, 1)
                    )
                  Fill: =RGBA(0, 0, 0, 0)
                  Font: =Font.Arial
                  Height: =31
                  OnSelect: =Select(Parent)
                  Size: =12
                  Text: =ThisItem.Description
                  VerticalAlign: =VerticalAlign.Bottom
                  Width: =170
                  X: =19
                  Y: =43
            - icnModuleArrowGo:
                Control: ModernIcon@1.1.1
                Properties:
                  Height: |+
                    =50
                  Icon: ="ArrowCircleRight"
                  IconColor: |-
                    =If(
                        ThisItem.Available,
                        RGBA(3, 23, 62, 1),
                        RGBA(135, 141, 146, 1)
                    )
                  OnSelect: =Select(Parent)
                  PaddingBottom: =5
                  PaddingLeft: =5
                  PaddingRight: =5
                  PaddingTop: =5
                  Width: |+
                    =50
                  X: =200
                  Y: =35
      - imgHCALogo:
          Control: Image@2.2.3
          Properties:
            BorderColor: =ColorValue("#03173E")
            Height: =50
            Image: =HCA_Healthcare_Logo_Extracted
            Width: =95
            X: =7
            Y: =7
      - lblSubtitle:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#E05929")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =45
            Size: =12
            Text: ="Expanse Automation"
            Width: =93
            X: =9
            Y: =54
      - btnNewSolutionAdd:
          Control: ModernButton@1.0.0
          Properties:
            Height: =64
            Text: ="Add New Solution"
            Y: =240
      - lblRcentActivity:
          Control: ModernText@1.0.0
          Properties:
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =14
            Text: ="Recent Activity "
            X: =110
            Y: =546
      - InformationButton1:
          Control: ModernInformationButton@1.0.1
          Properties:
            Content: ="Select Right Arrow Icon to continue through to that Cutover Automation Solution"
            X: =102
            Y: =110

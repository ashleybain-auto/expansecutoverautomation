ComponentDefinitions:
  cmpECCSCutoverReadinessDsh:
    DefinitionType: CanvasComponent
    Description: ReadinessDashboard
    AccessAppScope: true
    CustomProperties:
      BoardSubtitle:
        PropertyKind: Input
        DisplayName: Board Subtitle
        Description: A custom property
        DataType: Text
        Default: ="Text"
      BoardTitle:
        PropertyKind: Input
        DisplayName: Board Title
        Description: A custom property
        DataType: Text
        Default: ="Text"
      Record:
        PropertyKind: Input
        DisplayName: Record
        Description: A custom property
        DataType: Text
        Default: ="Text"
      SelectedRecord:
        PropertyKind: Output
        DisplayName: Selected Record
        Description: A custom property
        DataType: Record
      WaveSubwave:
        PropertyKind: Input
        DisplayName: Wave - Subwave
        Description: A custom property
        DataType: Text
        Default: ="Text"
    Properties:
      Height: =700
      SelectedRecord: |-
        ={SampleStringField: "SampleText", SampleNumberField: 10, SampleBooleanField: true}
      Width: =1200
    Children:
      - shpReadinessDash:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =ColorValue("#03173E")
            Fill: '=ColorValue("#03173E") '
            Height: =80
            Width: =1200
      - shpReadinessSidePanel:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =ColorValue("#03173E")
            Fill: =ColorValue("#03173E")
            Height: =700
            Width: =100
      - lblReadinessSubTitle:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#E05929")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =14
            Text: ="Cutover Automation Configuration Readiness"
            VerticalAlign: =VerticalAlign.Top
            Width: =345
            X: =127
            Y: =44
      - lblReadinessDashTitle:
          Control: ModernText@1.0.0
          Properties:
            Color: =Color.White
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =44
            Size: =17
            Text: ="Expanse Cutover Automation Readiness Dashboard"
            VerticalAlign: =VerticalAlign.Top
            Width: =480
            X: =108
            Y: =7
      - txtLogoExpanse:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#E05929")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =50
            Size: =13
            Text: ="Expanse Automation"
            Width: =94
            X: =6
            Y: =53
      - imgHCALogo2:
          Control: Image@2.2.3
          Properties:
            BorderColor: =ColorValue("#03173E")
            Height: =42
            Image: =HCA_Healthcare_Logo_Extracted
            Width: =95
            X: =7
            Y: =7
      - lblRegEventDate:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Right
            AutoHeight: =true
            Color: =RGBA(9, 33, 98, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Semibold
            Text: |-
              =With(
                  {
                      nextEvent: First(
                          Sort(
                              Filter(
                                  colECCSCutoverSchedule,
                                  StartDate >= Today()
                              ),
                              StartDate,
                              SortOrder.Ascending
                          )
                      )
                  },
                  If(
                      IsBlank(nextEvent.StartDate),
                      "No milestone scheduled",
                      nextEvent.EventName &
                      " | " &
                      Text(
                          nextEvent.StartDate,
                          "[$-en-US]mmmm d, yyyy"
                      )
                  )
              )
            Width: =310
            X: =890
            Y: =83
      - lblRegCountdown:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            Color: =ColorValue("#E05929")
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =45
            Size: =22
            Text: |-
              =With(
                  {
                      nextEvent: First(
                          Sort(
                              Filter(
                                  colECCSCutoverSchedule,
                                  StartDate >= Now()
                              ),
                              StartDate,
                              SortOrder.Ascending
                          )
                      )
                  },
                  If(
                      IsBlank(nextEvent.StartDate),
                      "COUNTDOWN NOT CONFIGURED",
                      With(
                          {
                              totalMinutes: DateDiff(
                                  Now(),
                                  nextEvent.StartDate,
                                  TimeUnit.Minutes
                              )
                          },
                          If(
                              totalMinutes <= 0,
                              "EVENT ACTIVE",
                              Int(totalMinutes / 1440) &
                              "d " &
                              Mod(
                                  Int(totalMinutes / 60),
                                  24
                              ) &
                              "h " &
                              Mod(
                                  totalMinutes,
                                  60
                              ) &
                              "m"
                          )
                      )
                  )
              )
            Width: =210
            X: =940
            Y: =114
      - lblRegReadiness:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#03173E")
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =16
            Text: ="REGISTRATION READINESS"
            Width: =240
            X: =100
            Y: =82
      - lblREGDashTotalCaption:
          Control: ModernText@1.0.0
          Properties:
            Text: ="Total Configuration Records"
            Font: =Font.Arial
            Size: =11
            Color: =ColorValue("#54585A")
            X: =115
            Y: =350
            Width: =245
            Height: =28
      - lblREGDashTotalKPI:
          Control: ModernText@1.0.0
          Properties:
            Text: =If(CountRows(colECCSReadinessSnapshots)=0, "No data", Text(Sum(colECCSReadinessSnapshots, 'Total Records'), "#,##0"))
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =22
            Color: =ColorValue("#03173E")
            X: =115
            Y: =380
            Width: =245
            Height: =48
      - lblREGDashMappedCaption:
          Control: ModernText@1.0.0
          Properties:
            Text: ="Mapped Records"
            Font: =Font.Arial
            Size: =11
            Color: =ColorValue("#54585A")
            X: =380
            Y: =350
            Width: =245
            Height: =28
      - lblREGDashMappedKPI:
          Control: ModernText@1.0.0
          Properties:
            Text: =If(CountRows(colECCSReadinessSnapshots)=0, "No data", Text(Sum(colECCSReadinessSnapshots, 'Mapped Records'), "#,##0"))
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =22
            Color: =ColorValue("#03173E")
            X: =380
            Y: =380
            Width: =245
            Height: =48
      - lblREGDashNoMatchCaption:
          Control: ModernText@1.0.0
          Properties:
            Text: ="NO MATCH Records"
            Font: =Font.Arial
            Size: =11
            Color: =ColorValue("#54585A")
            X: =645
            Y: =350
            Width: =245
            Height: =28
      - lblREGDashNoMatchKPI:
          Control: ModernText@1.0.0
          Properties:
            Text: =If(CountRows(colECCSReadinessSnapshots)=0, "No data", Text(Sum(colECCSReadinessSnapshots, 'No Match Records'), "#,##0"))
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =22
            Color: =ColorValue("#E05929")
            X: =645
            Y: =380
            Width: =245
            Height: =48
      - lblREGDashReadinessCaption:
          Control: ModernText@1.0.0
          Properties:
            Text: ="Mapping Readiness %"
            Font: =Font.Arial
            Size: =11
            Color: =ColorValue("#54585A")
            X: =910
            Y: =350
            Width: =245
            Height: =28
      - lblREGDashReadinessKPI:
          Control: ModernText@1.0.0
          Properties:
            Text: =If(CountRows(colECCSReadinessSnapshots)=0, "No data", Text(First(colECCSReadinessSnapshots).'Readiness Percentage', "0.0") & "%")
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =22
            Color: =ColorValue("#03173E")
            X: =910
            Y: =380
            Width: =245
            Height: =48

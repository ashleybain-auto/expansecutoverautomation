Screens:
  scrCutoverReadinessDash:
    Properties:
      Fill: =ColorValue("#F5F6F7")
      Height: =1450
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
      OnVisible: |+
        =        Refresh('ECCS Readiness Snapshots');
        Refresh('ECCS Readiness Status Summaries');
        Refresh('ECCS Readiness Exceptions');

        ClearCollect(
            colECCSReadinessSnapshots,
            'ECCS Readiness Snapshots'
        );

        ClearCollect(
            colECCSReadinessSummary,
            'ECCS Readiness Status Summaries'
        );

        ClearCollect(
            colECCSReadinessExceptions,
            'ECCS Readiness Exceptions'
        )
      Width: =1200
    Children:
      - cmpECCSCutoverReadinessDsh_1:
          Control: CanvasComponent
          ComponentName: cmpECCSCutoverReadinessDsh
          Properties:
            BoardSubtitle: ="Text"
            BoardTitle: ="Text"
            Height: =1450
            Record: ="Text"
            WaveSubwave: ="Text"
            Width: =1200
      - cmpECCSNavigationBar_Readiness:
          Control: CanvasComponent
          ComponentName: cmpECCSNavigationBarTop
          Properties:
            Height: =36
            OnReportsSelect: |+
              =
              Launch(
                  "https://app.powerbi.com/groups/me/reports/39bad50d-8b49-4db2-a199-2800a3bc53da/c6a949ff475c2b687530?ctid=335a6d75-c3eb-4b1a-ac08-d49338816ca0",
                  {},
                  LaunchTarget.New
              )
            Width: =620
            X: =580
            Y: =20

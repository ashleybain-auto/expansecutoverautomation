        Width: =420
        X: =338
        Y: =563
        ZIndex: =8

    lblActivityStatusHeader As modernText:
        AutoHeight: =true
        BorderStyle: =""
        Color: =RGBA(84, 88, 90, 1)
        Font: =Font.Arial
        FontWeight: =FontWeight.Bold
        Height: =20
        Size: =9
        Text: ="STATUS"
        Width: =100
        X: =775
        Y: =563
        ZIndex: =9

    btnAddNewModule As modernButton:
        BorderStyle: =""
        Font: =""
        Height: =47
        Size: =0
        Text: ="Add New Module"
        Visible: =false
        Width: =172
        X: =1120
        Y: =445
        ZIndex: =10

    galLaunchModules As gallery.galleryVertical:
        '#CopilotOverlayLabel': ="Filtered"
        BorderColor: |-
            =ColorValue("#03173E")
        DelayItemLoading: =true
        Height: =300
        Items: =colLaunchModules
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: |-
            =Switch(
                ThisItem.ModuleKey,
                "REG",
                    Navigate(
                        scrRegistrationLaunchpad,
                        ScreenTransition.Fade
                    ),
                "CNET",
                    Notify(
                        "CNET is coming soon.",
                        NotificationType.Information
                    ),
                Notify(
                    ThisItem.ModuleName & " workspace is coming soon.",
                    NotificationType.Information
                )
            )
        TemplateSize: =120
        Width: =1060
        WrapCount: =4
        X: =120
        Y: =160
        ZIndex: =11

        shpModuleTile As rectangle:
            BorderColor: =RGBA(217, 221, 226, 1)
            BorderThickness: =1
            Fill: |-
                =If(
                    ThisItem.Available,
                    RGBA(255, 255, 255, 1),
                    RGBA(232, 234, 236, 1)
                )
            Height: =105
            OnSelect: =Select(Parent)
            Width: =245
            X: =8
            Y: =8
            ZIndex: =1

        lblModuleIcon As modernText:
            AutoHeight: =true
            BorderStyle: =""
            Color: |-
                =If(
                    ThisItem.Available,
                    RGBA(224, 89, 41, 1),
                    RGBA(135, 141, 146, 1)
                )
            Fill: =RGBA(0, 0, 0, 0)
            Font: =""
            Height: =28
            OnSelect: =Select(Parent)
            Size: =17
            Text: |-
                =Switch(
                    ThisItem.ModuleKey,
                    "REG", "▣",
                    "PHA", "✚",
                    "NONMED", "▤",
                    "RAD", "◉",
                    "LAB", "△",
                    "DIET", "□",
                    "LOC", "▦",
                    "CNET", "◇",
                    "•"
                )
            Width: =28
            X: =20
            Y: =18
            ZIndex: =2

        lblModuleName As modernText:
            AutoHeight: =true
            BorderStyle: =""
            Color: |-
                =If(
                    ThisItem.Available,
                    RGBA(3, 23, 62, 1),
                    RGBA(135, 141, 146, 1)
                )
            Fill: =RGBA(0, 0, 0, 0)
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =26
            OnSelect: =Select(Parent)
            Size: =16
            Text: =ThisItem.ModuleName
            Width: =165
            X: =52
            Y: =17
            ZIndex: =3

        lblModuleDescription As modernText:
            BorderStyle: =""
            Color: |-
                =If(
                    ThisItem.Available,
                    RGBA(84, 88, 90, 1),
                    RGBA(135, 141, 146, 1)
                )
            Fill: =RGBA(0, 0, 0, 0)
            Font: =Font.Arial
            Height: =31
            OnSelect: =Select(Parent)
            Size: =12
            Text: =ThisItem.Description
            VerticalAlign: =VerticalAlign.Bottom
            Width: =195
            X: =36
            Y: =43
            ZIndex: =4

        lblModuleArrow As modernText:
            AutoHeight: =true
            BorderStyle: =""
            Color: |-
                =If(
                    ThisItem.Available,
                    RGBA(3, 23, 62, 1),
                    RGBA(135, 141, 146, 1)
                )
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =28
            OnSelect: =Select(Parent)
            Size: =16
            Text: =">"
            Width: =18
            X: =218
            Y: =42
            ZIndex: =5


cmpDrpdwnFiltersFacilityG As CanvasComponent:
    ChildTabPriority: =true
    ContentLanguage: =""
    EnableChildFocus: =true
    FacilityMnemonicName: ="Text"
    Fill: =RGBA(0, 0, 0, 0)
    Height: =75
    Records: ="Text"
    SelectedRecord: ="Text"
    Visible: =true
    WaveSubwave: ="Text"
    Width: =620
    X: =0
    Y: =0

    lblGlbWaveSubwave As modernText:
        BorderStyle: =""
        Color: |-
            =ColorValue("#03173E")
        Font: =Font.'Open Sans'
        FontWeight: =FontWeight.Semibold
        Size: =13
        Text: ="WAVE - SUBWAVE"
        Width: =240
        X: =5
        Y: =3
        ZIndex: =1

    drpWaveSubWave As modernDropdown:
        Appearance: =Appearance.FilledDarker
        BorderStyle: =""
        Font: =Font.'Open Sans'
        Height: =28
        ItemDisplayText: =ThisItem.Value
        Items: |-
            =Sort(
                Distinct(
                    Filter(
                        'dim.Ref.Organizations',
                        !IsBlank('Wave Number') &&
                        'Wave Number' <> "Wave" &&
                        'Wave Number' <> "NULL" &&
                        !IsBlank('SubWave2 Code') &&
                        'SubWave2 Code' <> "SubWave" &&
                        'SubWave2 Code' <> "NULL"
                    ),
                    'Wave Number' & " - " & 'SubWave2 Code'
                ),
                Value,
                SortOrder.Ascending
            )
        OnChange: |-
            =Set(
                gblSelectedWaveNumber,
                First(
                    Split(
                        drpWaveSubWave.Selected.Value,
                        " - "
                    )
                ).Value
            );
            Set(
                gblSelectedSubWaveCode,
                Last(
                    Split(
                        drpWaveSubWave.Selected.Value,
                        " - "
                    )
                ).Value
            );
            Set(
                gblSelectedFacility,
                Blank()
            );
            Set(
                gblSelectedNetworkMnemonic,
                Blank()
            )
        Required: =false
        Size: =12
        ValidationState: =ValidationState.None
        Width: =260
        X: =5
        Y: =32
        ZIndex: =2

    lblGlbFacilityMneName As modernText:
        BorderStyle: =""
        Color: |-
            =ColorValue("#03173E")
        Font: =Font.'Open Sans'
        FontWeight: =FontWeight.Semibold
        Size: =13
        Text: ="FACILITY MNEMONIC/NAME"
        Width: =250
        X: =325
        Y: =3
        ZIndex: =3

    drpFacilityMnemName As modernDropdown:
        Appearance: =Appearance.FilledDarker
        BorderStyle: =""
        Font: =Font.'Open Sans'
        Height: =28
        ItemDisplayText: =ThisItem.'Facility Mnemonic'
        Items: |-
            =Sort(
                Filter(
                    'dim.Ref.Organizations',
                    !IsBlank('Facility Mnemonic') &&
                    'Facility Mnemonic' <> "Facility Mnemonic" &&
                    'Facility Mnemonic' <> "NULL" &&
                    (
                        IsBlank(gblSelectedWaveNumber) ||
                        'Wave Number' = gblSelectedWaveNumber
                    ) &&
                    (
                        IsBlank(gblSelectedSubWaveCode) ||
                        'SubWave2 Code' = gblSelectedSubWaveCode
                    )
                ),
                'Facility Mnemonic',
                SortOrder.Ascending
            )
        OnChange: |-
            =Set(
                gblSelectedFacility,
                drpFacilityMnemName.Selected.'Facility Mnemonic'
            );
            Set(
                gblSelectedNetworkMnemonic,
                drpFacilityMnemName.Selected.'Network Mnemonic'
            )
        Required: =false
        Size: =12
        ValidationState: =ValidationState.None
        Width: =285
        X: =325
        Y: =32
        ZIndex: =4


srcMatchDashboard As screen:
    ContentLanguage: =""
    Fill: |-
        =ColorValue("#F5F7FA")

    shpDashboardHeader As rectangle:
        BorderColor: |-
            =ColorValue("#03173E")
        Fill: |-
            =ColorValue("#03173E")
        Height: =88
        Width: =Parent.Width
        ZIndex: =1

    lblDashboardTitle As modernText:
        BorderStyle: =""
        Color: =Color.White
        Font: =""
        FontWeight: =FontWeight.Bold
        Height: =50
        Size: =25
        Text: ="Expanse Cutover Configuration & Suite"
        Width: =800
        X: =28
        ZIndex: =2

    lblDashboardSubtitle As modernText:
        BorderStyle: =""
        Color: |-
            =ColorValue("#E05929")
        Font: =Font.Arial
        FontWeight: =FontWeight.Semibold
        Height: =38
        Size: =18
        Text: ="Registration | Target Match Dashboard"
        Width: =700
        X: =28
        Y: =38
        ZIndex: =3

    "galMatchDashboard As gallery.'BrowseLayout_Vertical_OneTextVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtered"
        BorderColor: |-
            =ColorValue("#03173E")
        DelayItemLoading: =true
        Fill: =RGBA(255, 255, 255, 1)
        Height: =301
        Items: |-
            =Table(
                {
                    MatchCategory: "NO MATCH",
                    DisplayLabel: "No Match"
                },
                {
                    MatchCategory: "TEST",
                    DisplayLabel: "TEST"
                },
                {
                    MatchCategory: "ZCON",
                    DisplayLabel: "ZCON"
                },
                {
                    MatchCategory: "LIVE",
                    DisplayLabel: "LIVE"
                }
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: |-
            =Set(
                gblSelectedMatchCategory,
                ThisItem.MatchCategory
            );
            Set(
                gblDashboardExpanded,
                true
            )
        ShowNavigation: =true
        TemplatePadding: =0
        TemplateSize: =75
        Width: =340
        X: =275
        Y: =152
        ZIndex: =4

        lblMatchCount As modernText:
            Align: =Align.Right
            BorderStyle: =""
            Font: =Font.Arial
            Height: =53
            Text: |-
                =CountRows(
                    Filter(
                        Switch(
                            Substitute(
                                Trim(
                                    Coalesce(
                                        gblSelectedWorksheet,
                                        ""
                                    )
                                ),
                                "REG ",
                                ""
                            ),
                            "Accommodations",
                                ForAll(
                                    Filter(
                                        'Accommodation Data Clone',
                                        FacilityMnem_Source = gblSelectedFacility
                                    ),
                                    {
                                        TargetMatchMtx: Coalesce(TargetMatchMtx, "")
                                    }
                                ),
                            "Locations",
                                ForAll(
                                    Filter(
                                        Locations,
                                        'Source Facility Mnemonic' = gblSelectedFacility
                                    ),
                                    {
                                        TargetMatchMtx: Coalesce('Target Match Matrix', "")
                                    }
                                ),
                            "Services",
                                ForAll(
                                    Filter(
                                        Services,
                                        'Source Facility Mnemonic' = gblSelectedFacility
                                    ),
                                    {
                                        TargetMatchMtx: Coalesce('Target Match Matrix', "")
                                    }
                                ),
                            "Insurance",
                                ForAll(
                                    Filter(
                                        Insurances,
                                        'Source Facility Mnemonic' = gblSelectedFacility
                                    ),
                                    {
                                        TargetMatchMtx: Coalesce('Target Match Matrix', "")
                                    }
                                ),
                            "RoomBed",
                                ForAll(
                                    Filter(
                                        'Room Beds',
                                        'Source Facility Code' = gblSelectedFacility
                                    ),
                                    {
                                        TargetMatchMtx: Coalesce('Target Match Status', "")
                                    }
                                ),
                            "Discharge Disposition",
                                ForAll(
                                    Filter(
                                        'Discharge Dispositions',
                                        'Network Mnemonic Source' = gblSelectedNetworkMnemonic
                                    ),
                                    {
                                        TargetMatchMtx: Coalesce('Target Match Matrix', "")
                                    }
                                ),
                            "Ins Auth Status",
                                ForAll(
                                    Filter(
                                        'Insurance Auths',
                                        'Network Mnemonic Source' = gblSelectedNetworkMnemonic
                                    ),
                                    {
                                        TargetMatchMtx: Coalesce('Target Match Matrix Note', "")
                                    }
                                ),
                            "Financial Approver",
                                ForAll(
                                    Filter(
                                        'Financial Approvers',
                                        'Source Network Mnemonic' = gblSelectedNetworkMnemonic
                                    ),
                                    {
                                        TargetMatchMtx: Coalesce('Target Match Matrix', "")
                                    }
                                ),
                            "Financial Class",
                                ForAll(
                                    Filter(
                                        'Financial Classes',
                                        'Source Network Mnemonic' = gblSelectedNetworkMnemonic
                                    ),
                                    {
                                        TargetMatchMtx: Coalesce('Target Match Matrix', "")
                                    }
                                ),
                            "Admit Source",
                                ForAll(
                                    Filter(
                                        'Admit Source Mapping',
                                        'Source Network Mnemonic' = gblSelectedNetworkMnemonic
                                    ),
                                    {
                                        TargetMatchMtx: Coalesce('Match Status', "")
                                    }
                                ),
                            FirstN(
                                Table(
                                    {
                                        TargetMatchMtx: ""
                                    }
                                ),
                                0
                            )
                        ),
                        If(
                            ThisItem.MatchCategory = "NO MATCH",
                            TargetMatchMtx = "NO MATCH",
                            StartsWith(
                                TargetMatchMtx,
                                ThisItem.MatchCategory
                            )
                        )
                    )
                ) & " records"
            Width: =107
            X: =199
            Y: =5
            ZIndex: =1

        NextArrow9 As icon:
            AccessibleLabel: =Self.Tooltip
            BorderColor: |-
                =ColorValue("#03173E")
            Color: =RGBA(166, 166, 166, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(244, 244, 244, 1)
            Height: =50
            Icon: =Icon.ChevronRight
            OnSelect: =Select(Parent)
            PaddingBottom: =12
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =12
            Tooltip: ="View item details"
            Width: =50
            X: =321
            Y: =7
            ZIndex: =2

        Separator9 As rectangle:
            BorderColor: |-
                =ColorValue("#03173E")
            Fill: =RGBA(255, 255, 255, 1)
            Height: =8
            OnSelect: =Select(Parent)
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - Self.Height
            ZIndex: =3

        Rectangle9 As rectangle:
            BorderColor: |-
                =ColorValue("#03173E")
            Fill: =RGBA(0, 89, 178, 1)
            Height: =Parent.TemplateHeight - Separator9.Height
            OnSelect: =Select(Parent)
            Visible: =ThisItem.IsSelected
            Width: =4
            ZIndex: =4

        Title9 As label:
            Color: =RGBA(50, 49, 48, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =27
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =16
            Text: =ThisItem.DisplayLabel
            VerticalAlign: =VerticalAlign.Top
            Width: =134
            X: =25
            Y: =18
            ZIndex: =5


    drpWaveSubwave As dropdown:
        BorderColor: |-
            =ColorValue("#03173E")
        ChevronBackground: =RGBA(0, 51, 102, 1)
        ChevronDisabledBackground: =RGBA(166, 166, 166, 1)
        ChevronDisabledFill: =RGBA(244, 244, 244, 1)
        ChevronHoverBackground: =ColorFade(RGBA(0, 51, 102, 1), -20%)
        ChevronHoverFill: =RGBA(255, 255, 255, 1)
        Default: =
        DisabledBorderColor: =RGBA(166, 166, 166, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        DisabledFill: =RGBA(244, 244, 244, 1)
        Font: =Font.Arial
        Height: =36
        HoverColor: =RGBA(0, 0, 0, 1)
        HoverFill: =RGBA(153, 205, 255, 1)
        Items: |-
            =Sort(
                Distinct(
                    Filter(
                        'dim.Ref.Organizations',
                        !IsBlank('Wave Number') &&
                        !IsBlank('SubWave2 Code') &&
                        'Wave Number' <> "Wave" &&
                        'SubWave2 Code' <> "SubWave" &&
                        'Wave Number' <> "NULL" &&
                        'SubWave2 Code' <> "NULL"
                    ),
                    'Wave Number' & " - " & 'SubWave2 Code'
                ),
                Value,
                SortOrder.Ascending
            )
        OnChange: |-
            =Set(
                gblSelectedWaveSubwave,
                drpWaveSubwave.Selected.Value
            );
            
            Set(
                gblSelectedWaveNumber,
                Left(
                    drpWaveSubwave.Selected.Value,
                    Find(
                        " - ",
                        drpWaveSubwave.Selected.Value
                    ) - 1
                )
            );
            
            Set(
                gblSelectedSubWaveCode,
                Mid(
                    drpWaveSubwave.Selected.Value,
                    Find(
                        " - ",
                        drpWaveSubwave.Selected.Value
                    ) + 3,
                    Len(
                        drpWaveSubwave.Selected.Value
                    )
                )
            );
            
            Reset(cmbFacilities);
            
            Set(
                gblSelectedFacility,
                Blank()
            );
            
            Set(
                gblSelectedNetworkMnemonic,
                Blank()
            );
            
            Set(
                gblSelectedAccommodation,
                Blank()
            );
            
            Set(
                gblEditMode,
                false
            );
            
            Set(
                gblSyncConfirmed,
                false
            )
        OnSelect: |-
            =Set(
                gblSelectedWaveSubwave,
                drpWaveSubwave.Selected.Value
            );
            
            Set(
                gblSelectedWaveNumber,
                Left(
                    drpWaveSubwave.Selected.Value,
                    Find(
                        " - ",
                        drpWaveSubwave.Selected.Value
                    ) - 1
                )
            );
            
            Set(
                gblSelectedSubWaveCode,
                Mid(
                    drpWaveSubwave.Selected.Value,
                    Find(
                        " - ",
                        drpWaveSubwave.Selected.Value
                    ) + 3,
                    Len(
                        drpWaveSubwave.Selected.Value
                    )
                )
            );
            
            Reset(cmbFacilities);
            
            Set(
                gblSelectedFacility,
                Blank()
            );
            
            Set(
                gblSelectedNetworkMnemonic,
                Blank()
            );
            
            Set(

          Properties:
            AutoHeight: =true
            Color: =ColorValue("#54585A")
            Font: =Font.Arial
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =12
            Text: ="NO MATCH"
            Width: =80
            X: =340
            Y: =235
      - lblRegNextMilestone:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            AutoHeight: =true
            Color: =ColorValue("#03173E")
            Font: =Font.Arial
            FontWeight: =FontWeight.Semibold
            Height: =30
            Size: =17
            Text: |-
              =With(
                  {
                      nextEvent: First(
                          Sort(
                              Filter(
                                  colECCSCutoverSchedule,
                                  StartDate >= Today()
                              ),
                              StartDate,
                              SortOrder.Ascending
                          )
                      )
                  },
                  If(
                      IsBlank(nextEvent.EventName),
                      "No milestone scheduled",
                      nextEvent.EventName &
                      " | " &
                      Text(
                          nextEvent.StartDate,
                          "[$-en-US]mmmm d, yyyy"
                      )
                  )
              )
            Width: =300
            X: =827
            Y: =15
      - lblRegCountdownLaunchpad:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            AutoHeight: =true
            Color: =ColorValue("#E05929")
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =40
            Size: =20
            Text: |-
              =With(
                  {
                      nextEvent: First(
                          Sort(
                              Filter(
                                  colECCSCutoverSchedule,
                                  StartDate >= Now()
                              ),
                              StartDate,
                              SortOrder.Ascending
                          )
                      )
                  },
                  If(
                      IsBlank(nextEvent.EventName),
                      "COUNTDOWN NOT CONFIGURED",
                      With(
                          {
                              totalMinutes: DateDiff(
                                  Now(),
                                  nextEvent.StartDate,
                                  TimeUnit.Minutes
                              )
                          },
                          If(
                              totalMinutes <= 0,
                              "EVENT ACTIVE",
                              Int(totalMinutes / 1440) &
                              "d " &
                              Mod(
                                  Int(totalMinutes / 60),
                                  24
                              ) &
                              "h " &
                              Mod(
                                  totalMinutes,
                                  60
                              ) &
                              "m"
                          )
                      )
                  )
              )
            Width: =200
            X: =877
            Y: =47
      - lblRegWorksheetReadinessHeader:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#03173E")
            Font: =Font.Arial
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =17
            Text: ="Registration Worksheet Readiness"
            Underline: =true
            Width: =300
            X: =863
            Y: =173
      - lblRegWorksheetReadiness:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Right
            Color: =ColorValue("#54585A")
            Font: =Font.Arial
            Height: =248
            Size: =16
            Text: |-
              =Concat(
                  Sort(
                      colRegReadiness,
                      WorksheetName,
                      SortOrder.Ascending
                  ),
                  WorksheetName &
                  "    " &
                  Text(TotalRecords) &
                  " records    " &
                  Text(
                      Round(
                          100 *
                          (
                              TestRecords +
                              ZconRecords +
                              LiveRecords
                          ) /
                          Max(
                              1,
                              TotalRecords
                          ),
                          0
                      )
                  ) &
                  "% mapped    " &
                  Text(
                      Round(
                          100 *
                          LiveRecords /
                          Max(
                              1,
                              TotalRecords
                          ),
                          0
                      )
                  ) &
                  "% LIVE    " &
                  Text(NoMatchRecords) &
                  " NO MATCH" &
                  Char(10)
              )
            VerticalAlign: =VerticalAlign.Top
            Width: =604
            X: =744
            Y: =207

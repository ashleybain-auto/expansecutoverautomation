      - lblRegReadinessTitle:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#03173E")
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =16
            Text: ="Registration Readiness"
            Width: =215
            X: =145
            Y: =155
      - lblRegReadinessMappedValue:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#03173E")
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =36
            Size: =20
            Text: |-
              =Text(
                  Round(
                      100 *
                      (
                          Sum(
                              colRegReadiness,
                              TestRecords
                          ) +
                          Sum(
                              colRegReadiness,
                              ZconRecords
                          ) +
                          Sum(
                              colRegReadiness,
                              LiveRecords
                          )
                      ) /
                      Max(
                          1,
                          Sum(
                              colRegReadiness,
                              TotalRecords
                          )
                      ),
                      0
                  )
              ) & "%"
            Width: =65
            X: =125
            Y: =187
      - lblRegReadinessMappedCaption:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#54585A")
            Font: =Font.Arial
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =12
            Text: ="MAPPED"
            Width: =75
            X: =120
            Y: =222
      - lblRegReadinessLiveValue:

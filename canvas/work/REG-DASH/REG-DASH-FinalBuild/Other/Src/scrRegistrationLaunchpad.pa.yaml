Screens:
  scrRegistrationLaunchpad:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      Height: =700
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
      OnVisible: |-
        =Set(
            gblRegistrationTab,
            "Summary"
        );
        Set(
            gblSelectedEnvironment,
            "Expanse TEST"
        );
        Set(
            gblSelectedWorksheet,
            "REG Accommodations"
        )
      Width: |+
        =1200

    Children:
      - cmpAppPageTemplateGlbl_1:
          Control: CanvasComponent
          ComponentName: cmpAppPageTemplateGlbl
          Properties:
            BoardSubtitle: ="Expanse Automation"
            BoardTitle: ="Expanse Cutover Configuration Suite"
            Height: =700
            Records: ="Text"
            WaveSubwaveFacility: ="Text"
            Width: =1200
            WorksheetName: ="Text"
      - lblRegLaunchTitle:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#E05929")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =30
            Text: ="Registration | Cutover Configuration Hub"
            Width: =350
            X: =108
            Y: =40
      - btnRegTabSummary:
          Control: ModernButton@1.0.0
          Properties:
            Appearance: =ButtonAppearance.Subtle
            BorderColor: =RGBA(240, 98, 15, 1)
            BorderStyle: =BorderStyle.Solid
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            OnSelect: |-
              =Set(
                  gblRegistrationTab,
                  "Summary"
              )
            Size: =13
            Text: ="Summary"
            VerticalAlign: =VerticalAlign.Middle
            Width: =90
            X: =5
            Y: =116
      - cmpECCSNavigationBarTop_4:
          Control: CanvasComponent
          ComponentName: cmpECCSNavigationBarTop
          Properties:
            Height: =36
            OnReportsSelect: =
            Width: =620
            X: =578
            Y: =20
      - btnRegProviderMapping:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            Appearance: =ButtonAppearance.Subtle
            BorderColor: =RGBA(240, 98, 15, 1)
            BorderStyle: =BorderStyle.Solid
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =42
            Icon: ="BriefcaseMedical"
            Layout: =ButtonLayout.TextOnly
            OnSelect: |
              =Notify(
                  "Provider Mapping is being configured.",
                  NotificationType.Information
              )
            PaddingBottom: =2
            PaddingLeft: =2
            PaddingRight: =2
            PaddingTop: =2
            Size: =13
            Text: ="Provider Mapping"
            VerticalAlign: =VerticalAlign.Middle
            Width: =90
            X: =5
            Y: =432
      - btnUpdateConfigTool:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            Appearance: =ButtonAppearance.Subtle
            BorderColor: =RGBA(240, 98, 15, 1)
            BorderStyle: =BorderStyle.Solid
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =42
            Icon: =
            Layout: =ButtonLayout.TextOnly
            OnSelect: |-
              =Navigate(
                  scrAccommodations,
                  ScreenTransition.Cover
              )
            PaddingBottom: =2
            PaddingLeft: =2
            PaddingRight: =2
            PaddingTop: =2
            Size: =13
            Text: ="Update ConfigTool"
            VerticalAlign: =VerticalAlign.Middle
            Width: =90
            X: =5
            Y: =209
      - btnRegTabNoMatchResults:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            Appearance: =ButtonAppearance.Subtle
            BorderColor: =RGBA(240, 98, 15, 1)
            BorderStyle: =BorderStyle.Solid
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =42
            Icon: ="DismissCircle"
            Layout: =ButtonLayout.TextOnly
            OnSelect: |-
              =Set(
                  gblSelectedMatchCategory,
                  "NO MATCH"
              );
              Navigate(
                  srcMatchDashboard,
                  ScreenTransition.Cover
              )
            PaddingBottom: =2
            PaddingLeft: =2
            PaddingRight: =2
            PaddingTop: =2
            Size: =13
            Text: ="No Match Dashboard"
            Width: =90
            X: =5
            Y: =356
      - btnRegXwalkExport:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            Appearance: =ButtonAppearance.Subtle
            BorderColor: =RGBA(240, 98, 15, 1)
            BorderStyle: =BorderStyle.Solid
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =42
            Icon: ="ArrowExit"
            Layout: =ButtonLayout.TextOnly
            OnSelect: |-
              =Navigate(
                  scrWorksheetResults,
                  ScreenTransition.Cover
              )
            PaddingBottom: =2
            PaddingLeft: =2
            PaddingRight: =2
            PaddingTop: =2
            Size: =13
            Text: ="Reg Crosswalks"
            VerticalAlign: =VerticalAlign.Middle
            Width: =90
            X: =5
            Y: =276

ComponentDefinitions:
  cmpECCSCutoverReadinessDsh:
    DefinitionType: CanvasComponent
    Description: ReadinessDashboard
    AccessAppScope: true
    CustomProperties:
      BoardSubtitle:
        PropertyKind: Input
        DisplayName: Board Subtitle
        Description: A custom property
        DataType: Text
        Default: ="Text"
      BoardTitle:
        PropertyKind: Input
        DisplayName: Board Title
        Description: A custom property
        DataType: Text
        Default: ="Text"
      Record:
        PropertyKind: Input
        DisplayName: Record
        Description: A custom property
        DataType: Text
        Default: ="Text"
      SelectedRecord:
        PropertyKind: Output
        DisplayName: Selected Record
        Description: A custom property
        DataType: Record
      WaveSubwave:
        PropertyKind: Input
        DisplayName: Wave - Subwave
        Description: A custom property
        DataType: Text
        Default: ="Text"
    Properties:
      Height: =1450
      SelectedRecord: |-
        ={SampleStringField: "SampleText", SampleNumberField: 10, SampleBooleanField: true}
      Width: =1200
    Children:
      - shpReadinessDash:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =ColorValue("#03173E")
            Fill: '=ColorValue("#03173E") '
            Height: =80
            Width: =1200
      - shpReadinessSidePanel:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =ColorValue("#03173E")
            Fill: =ColorValue("#03173E")
            Height: =1450
            Width: =100
      - lblReadinessSubTitle:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#E05929")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =14
            Text: ="Cutover Automation Configuration Readiness"
            VerticalAlign: =VerticalAlign.Top
            Width: =345
            X: =127
            Y: =44
      - lblReadinessDashTitle:
          Control: ModernText@1.0.0
          Properties:
            Color: =Color.White
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =44
            Size: =17
            Text: ="Expanse Cutover Automation Readiness Dashboard"
            VerticalAlign: =VerticalAlign.Top
            Width: =480
            X: =108
            Y: =7
      - txtLogoExpanse:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#E05929")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =50
            Size: =13
            Text: ="Expanse Automation"
            Width: =94
            X: =6
            Y: =53
      - imgHCALogo2:
          Control: Image@2.2.3
          Properties:
            BorderColor: =ColorValue("#03173E")
            Height: =42
            Image: =HCA_Healthcare_Logo_Extracted
            Width: =95
            X: =7
            Y: =7
      - lblRegEventDate:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Right
            AutoHeight: =true
            Color: =RGBA(9, 33, 98, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Text: |-
              =With(
                  {
                      nextEvent: First(
                          Sort(
                              Filter(
                                  colECCSCutoverSchedule,
                                  StartDate >= Today()
                              ),
                              StartDate,
                              SortOrder.Ascending
                          )
                      )
                  },
                  If(
                      IsBlank(nextEvent.StartDate),
                      "No milestone scheduled",
                      nextEvent.EventName &
                      " | " &
                      Text(
                          nextEvent.StartDate,
                          "[$-en-US]mmmm d, yyyy"
                      )
                  )
              )
            Width: =310
            X: =890
            Y: =83
      - lblRegCountdown:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            Color: =ColorValue("#E05929")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =45
            Size: =22
            Text: |-
              =With(
                  {
                      nextEvent: First(
                          Sort(
                              Filter(
                                  colECCSCutoverSchedule,
                                  StartDate >= Now()
                              ),
                              StartDate,
                              SortOrder.Ascending
                          )
                      )
                  },
                  If(
                      IsBlank(nextEvent.StartDate),
                      "COUNTDOWN NOT CONFIGURED",
                      With(
                          {
                              totalMinutes: DateDiff(
                                  Now(),
                                  nextEvent.StartDate,
                                  TimeUnit.Minutes
                              )
                          },
                          If(
                              totalMinutes <= 0,
                              "EVENT ACTIVE",
                              Int(totalMinutes / 1440) &
                              "d " &
                              Mod(
                                  Int(totalMinutes / 60),
                                  24
                              ) &
                              "h " &
                              Mod(
                                  totalMinutes,
                                  60
                              ) &
                              "m"
                          )
                      )
                  )
              )
            Width: =210
            X: =940
            Y: =114
      - lblRegReadiness:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#03173E")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =16
            Text: ="REGISTRATION READINESS"
            Width: =240
            X: =100
            Y: =82
      - lblREGDashTotalCaption:
          Control: ModernText@1.0.0
          Properties:
            Text: ="Total Configuration Records"
            Font: =Font.'Open Sans'
            Size: =11
            Color: =ColorValue("#54585A")
            X: =115
            Y: =350
            Width: =245
            Height: =28
      - lblREGDashTotalKPI:
          Control: ModernText@1.0.0
          Properties:
            Text: =If(CountRows(Filter(colECCSReadinessSnapshots, 'Data Current' = true && IsBlank('Facility Mnemonic') && IsBlank('Worksheet Name'))) = 0, "No data", Text(First(Filter(colECCSReadinessSnapshots, 'Data Current' = true && IsBlank('Facility Mnemonic') && IsBlank('Worksheet Name'))).'Total Records', "#,##0"))
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =22
            Color: =ColorValue("#03173E")
            X: =115
            Y: =380
            Width: =245
            Height: =48
      - lblREGDashMappedCaption:
          Control: ModernText@1.0.0
          Properties:
            Text: ="Mapped Records"
            Font: =Font.'Open Sans'
            Size: =11
            Color: =ColorValue("#54585A")
            X: =380
            Y: =350
            Width: =245
            Height: =28
      - lblREGDashMappedKPI:
          Control: ModernText@1.0.0
          Properties:
            Text: =If(CountRows(Filter(colECCSReadinessSnapshots, 'Data Current' = true && IsBlank('Facility Mnemonic') && IsBlank('Worksheet Name'))) = 0, "No data", Text(First(Filter(colECCSReadinessSnapshots, 'Data Current' = true && IsBlank('Facility Mnemonic') && IsBlank('Worksheet Name'))).'Mapped Records', "#,##0"))
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =22
            Color: =ColorValue("#03173E")
            X: =380
            Y: =380
            Width: =245
            Height: =48
      - lblREGDashNoMatchCaption:
          Control: ModernText@1.0.0
          Properties:
            Text: ="NO MATCH Records"
            Font: =Font.'Open Sans'
            Size: =11
            Color: =ColorValue("#54585A")
            X: =645
            Y: =350
            Width: =245
            Height: =28
      - lblREGDashNoMatchKPI:
          Control: ModernText@1.0.0
          Properties:
            Text: =If(CountRows(Filter(colECCSReadinessSnapshots, 'Data Current' = true && IsBlank('Facility Mnemonic') && IsBlank('Worksheet Name'))) = 0, "No data", Text(First(Filter(colECCSReadinessSnapshots, 'Data Current' = true && IsBlank('Facility Mnemonic') && IsBlank('Worksheet Name'))).'No Match Records', "#,##0"))
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =22
            Color: =ColorValue("#E05929")
            X: =645
            Y: =380
            Width: =245
            Height: =48
      - lblREGDashReadinessCaption:
          Control: ModernText@1.0.0
          Properties:
            Text: ="Mapping Readiness %"
            Font: =Font.'Open Sans'
            Size: =11
            Color: =ColorValue("#54585A")
            X: =910
            Y: =350
            Width: =245
            Height: =28
      - lblREGDashReadinessKPI:
          Control: ModernText@1.0.0
          Properties:
            Text: =If(CountRows(Filter(colECCSReadinessSnapshots, 'Data Current' = true && IsBlank('Facility Mnemonic') && IsBlank('Worksheet Name'))) = 0, "No data", Text(First(Filter(colECCSReadinessSnapshots, 'Data Current' = true && IsBlank('Facility Mnemonic') && IsBlank('Worksheet Name'))).'Readiness Percentage', "0.0") & "%")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =22
            Color: =ColorValue("#03173E")
            X: =910
            Y: =380
            Width: =245
            Height: =48
      - lblREGWorksheetChartTitle:
          Control: ModernText@1.0.0
          Properties:
            Text: ="READINESS BY WORKSHEET"
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =16
            Color: =ColorValue("#03173E")
            X: =115
            Y: =470
            Width: =450
            Height: =36
      - lblREGFacilityChartTitle:
          Control: ModernText@1.0.0
          Properties:
            Text: ="READINESS BY FACILITY"
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =16
            Color: =ColorValue("#03173E")
            X: =115
            Y: =790
            Width: =450
            Height: =36
      - lblREGExceptionsTitle:
          Control: ModernText@1.0.0
          Properties:
            Text: ="EXCEPTIONS / NO MATCH"
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =16
            Color: =ColorValue("#E05929")
            X: =115
            Y: =1110
            Width: =450
            Height: =36
      - galREGWorksheetReadiness:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
          Properties:
            BorderColor: =ColorValue("#D9E1EA")
            Height: =240
            Width: =1040
            X: =115
            Y: =510
            TemplateSize: =48
            Items: |-
              =AddColumns(
                  GroupBy(
                      Filter(
                          colECCSReadinessSummary,
                          'Data Current' = true &&
                          'Facility Scope' = "All Facilities" &&
                          !IsBlank('Worksheet Name')
                      ),
                      'Worksheet Name',
                      StatusRows
                  ),
                  MappedCount,
                  Sum(Filter(StatusRows, 'Readiness Status' = "Mapped"), 'Record Count'),
                  NeedsCount,
                  Sum(Filter(StatusRows, 'Readiness Status' = "Needs Mapping"), 'Record Count'),
                  IncompleteCount,
                  Sum(Filter(StatusRows, 'Readiness Status' = "Incomplete Target"), 'Record Count')
              )
          Children:
            - lblREGWorksheetRow:
                Control: ModernText@1.0.0
                Properties:
                  Font: =Font.'Open Sans'
                  Size: =12
                  Color: =ColorValue("#03173E")
                  Text: =ThisItem.'Worksheet Name'
                  Width: =225
                  Height: =40
                  X: =8
                  Y: =2
            - shpREGWorksheetMappedBar:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =ColorValue("#03173E")
                  X: =245
                  Y: =17
                  Height: =14
                  Width: =Max(0, 600 * ThisItem.MappedCount / Max(1, ThisItem.MappedCount + ThisItem.NeedsCount + ThisItem.IncompleteCount))
            - shpREGWorksheetNeedsMappingBar:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =ColorValue("#E05929")
                  X: =245 + shpREGWorksheetMappedBar.Width
                  Y: =17
                  Height: =14
                  Width: =Max(0, 600 * ThisItem.NeedsCount / Max(1, ThisItem.MappedCount + ThisItem.NeedsCount + ThisItem.IncompleteCount))
            - shpREGWorksheetIncompleteBar:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =ColorValue("#AEB5BF")
                  X: =shpREGWorksheetNeedsMappingBar.X + shpREGWorksheetNeedsMappingBar.Width
                  Y: =17
                  Height: =14
                  Width: =Max(0, 600 * ThisItem.IncompleteCount / Max(1, ThisItem.MappedCount + ThisItem.NeedsCount + ThisItem.IncompleteCount))
      - galREGFacilityReadiness:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
          Properties:
            BorderColor: =ColorValue("#D9E1EA")
            Height: =240
            Width: =1040
            X: =115
            Y: =830
            TemplateSize: =48
            Items: |-
              =AddColumns(
                  GroupBy(
                      Filter(
                          colECCSReadinessSummary,
                          'Data Current' = true &&
                          'Worksheet Scope' = "All Worksheets" &&
                          !IsBlank('Facility Mnemonic')
                      ),
                      'Facility Mnemonic',
                      StatusRows
                  ),
                  MappedCount,
                  Sum(Filter(StatusRows, 'Readiness Status' = "Mapped"), 'Record Count'),
                  NeedsCount,
                  Sum(Filter(StatusRows, 'Readiness Status' = "Needs Mapping"), 'Record Count'),
                  IncompleteCount,
                  Sum(Filter(StatusRows, 'Readiness Status' = "Incomplete Target"), 'Record Count')
              )
          Children:
            - lblREGFacilityRow:
                Control: ModernText@1.0.0
                Properties:
                  Font: =Font.'Open Sans'
                  Size: =12
                  Color: =ColorValue("#03173E")
                  Text: =ThisItem.'Facility Mnemonic'
                  Width: =225
                  Height: =40
                  X: =8
                  Y: =2
            - shpREGFacilityMappedBar:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =ColorValue("#03173E")
                  X: =245
                  Y: =17
                  Height: =14
                  Width: =Max(0, 600 * ThisItem.MappedCount / Max(1, ThisItem.MappedCount + ThisItem.NeedsCount + ThisItem.IncompleteCount))
            - shpREGFacilityNeedsMappingBar:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =ColorValue("#E05929")
                  X: =245 + shpREGFacilityMappedBar.Width
                  Y: =17
                  Height: =14
                  Width: =Max(0, 600 * ThisItem.NeedsCount / Max(1, ThisItem.MappedCount + ThisItem.NeedsCount + ThisItem.IncompleteCount))
            - shpREGFacilityIncompleteBar:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =ColorValue("#AEB5BF")
                  X: =shpREGFacilityNeedsMappingBar.X + shpREGFacilityNeedsMappingBar.Width
                  Y: =17
                  Height: =14
                  Width: =Max(0, 600 * ThisItem.IncompleteCount / Max(1, ThisItem.MappedCount + ThisItem.NeedsCount + ThisItem.IncompleteCount))
      - galREGReadinessExceptions:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
          Properties:
            BorderColor: =ColorValue("#D9E1EA")
            Height: =260
            Width: =1040
            X: =115
            Y: =1150
            TemplateSize: =52
            Items: |-
              =Sort(
                  Filter(
                      colECCSReadinessExceptions,
                      'Data Current' = true
                  ),
                  'Facility Mnemonic',
                  SortOrder.Ascending
              )
          Children:
            - lblREGExceptionRow:
                Control: ModernText@1.0.0
                Properties:
                  Font: =Font.'Open Sans'
                  Size: =11
                  Color: =ColorValue("#54585A")
                  Text: =ThisItem.'Facility Mnemonic' & " | " & ThisItem.'Worksheet Name' & " | " & ThisItem.'Source Mnemonic' & " | " & ThisItem.'Readiness Status'
                  Width: =1000
                  Height: =44
                  X: =8
                  Y: =2

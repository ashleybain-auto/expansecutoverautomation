ComponentDefinitions:
  cmpAppPageTemplateGlbl:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      BoardSubtitle:
        PropertyKind: Input
        DisplayName: Board Subtitle
        Description: '"Expanse Automation"'
        DataType: Text
        Default: ="Expanse Automation"
      BoardTitle:
        PropertyKind: Input
        DisplayName: Board Title
        Description: '"Expanse Cutover Configuration Suite" '
        DataType: Text
        Default: ="Expanse Cutover Configuration Suite"
      Records:
        PropertyKind: Input
        DisplayName: Records
        Description: A custom property
        RaiseOnReset: true
        DataType: Text
        Default: ="Text"
      SelectedRecord:
        PropertyKind: Output
        DisplayName: Selected Record
        Description: A custom property
        DataType: Text
      WaveSubwaveFacility:
        PropertyKind: Input
        DisplayName: Wave Subwave-Facility
        Description: A custom property
        RaiseOnReset: true
        DataType: Text
        Default: ="Text"
      WorksheetName:
        PropertyKind: Input
        DisplayName: Worksheet Name
        Description: A custom property
        RaiseOnReset: true
        DataType: Text
        Default: ="Text"
    Properties:
      Height: =700
      SelectedRecord: ="Text"
      Width: =1200
    Children:
      - shpSidePanelG_1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 89, 178, 1)
            Fill: =ColorValue("#03173E")
            Height: =700
            Width: =100
      - shpTopPanelG_1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 89, 178, 1)
            Fill: =ColorValue("#03173E")
            Height: =85
            Width: =1200
      - imgLogoHCA-Global_1:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 89, 178, 1)
            Height: =45
            Image: =HCA_Healthcare_Logo_Extracted
            Width: =90
            X: =7
            Y: =7
      - lblBoardTitleG_1:
          Control: ModernText@1.0.0
          Properties:
            Color: =Color.White
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =45
            Size: =17
            Text: ="Expanse Cutover Automation Configuration Suite"
            VerticalAlign: =VerticalAlign.Top
            Width: =465
            X: =105
            Y: =7
      - lblExpanseAutomationG_1:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#E05929")
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =46
            Size: =12
            Text: ="Expanse Automation"
            VerticalAlign: =VerticalAlign.Top
            Width: =92
            X: =5
            Y: =52

ComponentDefinitions:
  cmpECCSNavigationBarTop:
    DefinitionType: CanvasComponent
    Description: Site Navigation
    AccessAppScope: true
    Properties:
      Height: =36
      Width: =620
    Children:
      - shpNavigationHeader:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =ColorValue("#03173E")
            Fill: =RGBA(0, 0, 0, 0)
            Height: =34
            Width: =620
            Y: =2
      - btnHome4:
          Control: ModernButton@1.0.0
          Properties:
            Font: =Font.'Open Sans'
            Icon: ="Home"
            OnSelect: |-
              =Navigate(
                  scrLaunchPad,
                  ScreenTransition.Fade
              )
            Size: =14
            Text: ="HOME"
            Width: =95
            Y: =2
      - btnBack4:
          Control: ModernButton@1.0.0
          Properties:
            Font: =Font.'Open Sans'
            Icon: ="ArrowLeft"
            OnSelect: =Back()
            Size: =14
            Text: ="BACK"
            Width: =95
            X: =272
            Y: =2
      - btnRefresh4:
          Control: ModernButton@1.0.0
          Properties:
            Font: =Font.'Open Sans'
            Icon: ="ArrowSync"
            OnSelect: |-
              =Switch(
                  App.ActiveScreen,
                  scrRegistrationLaunchpad,
                      Refresh('Accommodation Data Clone');
                      Refresh('Reg Config Categories');
                      Refresh('dim.Ref.Organizations');
                      Refresh(Locations);
                      Refresh(Services);
                      Refresh(Insurances);
                      Refresh('Room Beds');
                      Refresh('Discharge Dispositions');
                      Refresh('Insurance Auths');
                      Refresh('Financial Approvers');
                      Refresh('Financial Classes');
                      Refresh('Admit Source Mapping'),
                  scrAccommodations,
                      Refresh('Accommodation Data Clone');
                      Refresh('Reg Config Categories');
                      Refresh('dim.Ref.Organizations'),
                  srcMatchDashboard,
                      Refresh('Accommodation Data Clone');
                      Refresh('Reg Config Categories');
                      Refresh('dim.Ref.Organizations'),
                  scrWorksheetResults,
                      Refresh(Locations);
                      Refresh('Reg Config Categories');
                      Refresh('dim.Ref.Organizations'),
                  cmpECCSConfigurations,
                      Refresh('Accommodation Data Clone');
                      Refresh('Reg Config Categories');
                      Refresh('dim.Ref.Organizations'),
                  scrCutoverReadinessDash,
                      Refresh('Accommodation Data Clone');
                      Refresh('Reg Config Categories');
                      Refresh('dim.Ref.Organizations');
                      Refresh(Locations);
                      Refresh(Services);
                      Refresh(Insurances);
                      Refresh('Room Beds');
                      Refresh('Discharge Dispositions');
                      Refresh('Insurance Auths');
                      Refresh('Financial Approvers');
                      Refresh('Financial Classes');
                      Refresh('Admit Source Mapping'),
                  scrLaunchPad,
                      Refresh('Reg Config Categories');
                      Refresh('dim.Ref.Organizations')
              )
            Size: =13
            Text: ="REFRESH"
            Width: =105
            X: =382
            Y: =2
      - btnNext4:
          Control: ModernButton@1.0.0
          Properties:
            Font: =Font.'Open Sans'
            Icon: ="ArrowRight"
            Layout: =ButtonLayout.IconAfter
            OnSelect: |-
              =Switch(
                  App.ActiveScreen,
                  scrLaunchPad,
                      Navigate(
                          scrRegistrationLaunchpad,
                          ScreenTransition.Fade
                      ),
                  scrRegistrationLaunchpad,
                      Navigate(
                          scrAccommodations,
                          ScreenTransition.Cover
                      ),
                  scrAccommodations,
                      Navigate(
                          cmpECCSConfigurations,
                          ScreenTransition.Cover
                      ),
                  cmpECCSConfigurations,
                      Navigate(
                          srcMatchDashboard,
                          ScreenTransition.Cover
                      ),
                  srcMatchDashboard,
                      Navigate(
                          scrWorksheetResults,
                          ScreenTransition.Cover
                      ),
                  scrWorksheetResults,
                      Navigate(
                          scrCutoverReadinessDash,
                          ScreenTransition.Cover
                      ),
                  scrCutoverReadinessDash,
                      Navigate(
                          scrLaunchPad,
                          ScreenTransition.Fade
                      ),
                  Navigate(
                      scrLaunchPad,
                      ScreenTransition.Fade
                  )
              )
            Size: =14
            Text: ="NEXT"
            Width: =95
            X: =502
            Y: =2
      - btnReports1:
          Control: ModernButton@1.0.0
          Properties:
            Font: =Font.'Open Sans'
            Size: =14
            Text: ="REPORTS"
            Width: =95
            X: =136
            Y: =2

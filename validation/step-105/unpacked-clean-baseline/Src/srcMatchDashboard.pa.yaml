                          'Wave Number' <> "Wave" &&
                          'SubWave2 Code' <> "SubWave" &&
                          'Wave Number' <> "NULL" &&
                          'SubWave2 Code' <> "NULL"
                      ),
                      'Wave Number' & " - " & 'SubWave2 Code'
                  ),
                  Value,
                  SortOrder.Ascending
              )
            Items.Value: =Value
            OnChange: |-
              =Set(
                  gblSelectedWaveSubwave,
                  drpWaveSubwave.Selected.Value
              );

              Set(
                  gblSelectedWaveNumber,
                  Left(
                      drpWaveSubwave.Selected.Value,
                      Find(
                          " - ",
                          drpWaveSubwave.Selected.Value
                      ) - 1
                  )
              );

              Set(
                  gblSelectedSubWaveCode,
                  Mid(
                      drpWaveSubwave.Selected.Value,
                      Find(
                          " - ",
                          drpWaveSubwave.Selected.Value
                      ) + 3,
                      Len(
                          drpWaveSubwave.Selected.Value
                      )
                  )
              );

              Reset(cmbFacilities);

              Set(
                  gblSelectedFacility,
                  Blank()
              );

              Set(
                  gblSelectedNetworkMnemonic,
                  Blank()
              );

              Set(
                  gblSelectedAccommodation,
                  Blank()
              );

              Set(
                  gblEditMode,
                  false
              );

              Set(
                  gblSyncConfirmed,
                  false
              )

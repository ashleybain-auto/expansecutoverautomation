Screens:
  srcMatchDashboard:
    Properties:
      Fill: =ColorValue("#F5F7FA")
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
    Children:
      - shpDashboardHeader:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =ColorValue("#03173E")
            Fill: =ColorValue("#03173E")
            Height: =88
            Width: =Parent.Width
      - lblDashboardTitle:
          Control: ModernText@1.0.0
          Properties:
            Color: =Color.White
            FontWeight: =FontWeight.Bold
            Height: =50
            Size: =25
            Text: ="Expanse Cutover Configuration & Suite"
            Width: =800
            X: =28
      - lblDashboardSubtitle:
          Control: ModernText@1.0.0
          Properties:
            Color: =ColorValue("#E05929")
            Font: =Font.Arial
            FontWeight: =FontWeight.Semibold
            Height: =38
            Size: =18
            Text: ="Registration | Target Match Dashboard"
            Width: =700
            X: =28
            Y: =38
      - galMatchDashboard:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
          Properties:
            BorderColor: =ColorValue("#03173E")
            Fill: =RGBA(255, 255, 255, 1)
            Height: =301
            Items: |-
              =Table(
                  {
                      MatchCategory: "NO MATCH",
                      DisplayLabel: "No Match"
                  },
                  {
                      MatchCategory: "TEST",
                      DisplayLabel: "TEST"
                  },
                  {
                      MatchCategory: "ZCON",
                      DisplayLabel: "ZCON"
                  },
                  {
                      MatchCategory: "LIVE",
                      DisplayLabel: "LIVE"
                  }
              )
            OnSelect: |-
              =Set(
                  gblSelectedMatchCategory,
                  ThisItem.MatchCategory
              );
              Set(
                  gblDashboardExpanded,
                  true
              )
            ShowNavigation: =true
            TemplateSize: =75
            Width: =340
            X: =275
            Y: =152
          Children:
            - lblMatchCount:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Right
                  Font: =Font.Arial
                  Height: =53
                  Text: |-
                    =CountRows(
                        Filter(
                            Switch(
                                Substitute(
                                    Trim(
                                        Coalesce(
                                            gblSelectedWorksheet,
                                            ""
                                        )
                                    ),
                                    "REG ",
                                    ""
                                ),
                                "Accommodations",
                                    ForAll(
                                        Filter(
                                            'Accommodation Data Clone',
                                            FacilityMnem_Source = gblSelectedFacility
                                        ),
                                        {
                                            TargetMatchMtx: Coalesce(TargetMatchMtx, "")
                                        }
                                    ),
                                "Locations",
                                    ForAll(
                                        Filter(
                                            Locations,
                                            'Source Facility Mnemonic' = gblSelectedFacility
                                        ),
                                        {
                                            TargetMatchMtx: Coalesce('Target Match Matrix', "")
                                        }
                                    ),
                                "Services",
                                    ForAll(
                                        Filter(
                                            Services,
                                            'Source Facility Mnemonic' = gblSelectedFacility
                                        ),
                                        {
                                            TargetMatchMtx: Coalesce('Target Match Matrix', "")
                                        }
                                    ),
                                "Insurance",
                                    ForAll(
                                        Filter(
                                            Insurances,
                                            'Source Facility Mnemonic' = gblSelectedFacility
                                        ),
                                        {
                                            TargetMatchMtx: Coalesce('Target Match Matrix', "")
                                        }
                                    ),
                                "RoomBed",
                                    ForAll(
                                        Filter(
                                            'Room Beds',
                                            'Source Facility Code' = gblSelectedFacility
                                        ),
                                        {
                                            TargetMatchMtx: Coalesce('Target Match Status', "")
                                        }
                                    ),
                                "Discharge Disposition",
                                    ForAll(
                                        Filter(
                                            'Discharge Dispositions',
                                            'Network Mnemonic Source' = gblSelectedNetworkMnemonic
                                        ),
                                        {
                                            TargetMatchMtx: Coalesce('Target Match Matrix', "")
                                        }
                                    ),
                                "Ins Auth Status",
                                    ForAll(
                                        Filter(
                                            'Insurance Auths',
                                            'Network Mnemonic Source' = gblSelectedNetworkMnemonic
                                        ),
                                        {
                                            TargetMatchMtx: Coalesce('Target Match Matrix Note', "")
                                        }
                                    ),
                                "Financial Approver",
                                    ForAll(
                                        Filter(
                                            'Financial Approvers',
                                            'Source Network Mnemonic' = gblSelectedNetworkMnemonic
                                        ),
                                        {
                                            TargetMatchMtx: Coalesce('Target Match Matrix', "")
                                        }
                                    ),
                                "Financial Class",
                                    ForAll(
                                        Filter(
                                            'Financial Classes',
                                            'Source Network Mnemonic' = gblSelectedNetworkMnemonic
                                        ),
                                        {
                                            TargetMatchMtx: Coalesce('Target Match Matrix', "")
                                        }
                                    ),
                                "Admit Source",
                                    ForAll(
                                        Filter(
                                            'Admit Source Mapping',
                                            'Source Network Mnemonic' = gblSelectedNetworkMnemonic
                                        ),
                                        {
                                            TargetMatchMtx: Coalesce('Match Status', "")
                                        }
                                    ),
                                FirstN(
                                    Table(
                                        {
                                            TargetMatchMtx: ""
                                        }
                                    ),
                                    0
                                )
                            ),
                            If(
                                ThisItem.MatchCategory = "NO MATCH",
                                TargetMatchMtx = "NO MATCH",
                                StartsWith(
                                    TargetMatchMtx,
                                    ThisItem.MatchCategory
                                )
                            )
                        )
                    ) & " records"
                  Width: =107
                  X: =199
                  Y: =5
            - NextArrow9:

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expanse-configtool-factory"
version = "0.1.0"
description = "Expanse Cutover Configuration Suite ConfigTool Factory"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32,<3"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pylint.main]
py-version = "3.14"
